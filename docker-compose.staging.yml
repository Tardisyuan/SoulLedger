# Staging overrides: production settings (DEBUG unset in the base) but no
# nginx and no TLS, so the two services publish their own ports and Django's
# https redirect is switched off — with it on and nothing terminating TLS,
# every request would be redirected to an https that nobody answers (IS-04).
# ALLOWED_HOSTS, ENCRYPTION_KEY, SENTRY_DSN come from the root `.env`.
services:
  backend:
    ports:
      - "8000:8000"
    environment:
      SECURE_SSL_REDIRECT: "false"

  frontend:
    ports:
      - "3000:3000"
