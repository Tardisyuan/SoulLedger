name: Security Scan

# Manual-dispatch only: this repo is out of GitHub Actions minutes. The weekly
# cron is disabled for the same reason — a schedule spends minutes with nobody
# asking. Run it from the Actions tab, or `gh workflow run security.yml`.
# To restore automatic runs, put the triggers below back.
on:
  workflow_dispatch:

# Least privilege for the job token (audit IS-19, 2026-09-14). Nothing here
# writes to the repository, comments, or publishes: every job checks out, runs
# a gate, and (e2e) uploads an artifact, which uses the Actions runtime token,
# not GITHUB_TOKEN. Measured 2026-09-14, the repository default is already
# `read` (`gh api repos/Tardisyuan/SoulLedger/actions/permissions/workflow`),
# so this changes nothing today. It is here so the answer lives in the file:
# a settings toggle, a fork, or a copy of this workflow into another repository
# would otherwise hand every step a write token without any diff to review.
#
# Actions are pinned to the commit their major tag pointed at when this was
# written (resolved via `gh api repos/<action>/git/ref/tags/<major>`), with the
# exact release beside it. A tag can be moved; a SHA cannot. Bump by resolving
# again, not by editing the comment.
permissions:
  contents: read

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # A real gate: a moderate-or-worse finding in shipped dependencies fails
      # the job. `--omit=dev` replaces the deprecated `--production` spelling
      # and scopes the scan to what actually ships, so a devDependency advisory
      # does not block a release it cannot reach.
      #
      # Accepted advisories: none.
      #
      # npm audit has no per-advisory ignore flag — `--audit-level` is the only
      # dial, and it is severity-wide. So if one specific advisory ever has to
      # be accepted, do NOT add `continue-on-error` (that accepts every present
      # and future finding, not the one being argued about) and do NOT lower
      # `--audit-level` (same problem, one notch down). Either force a patched
      # transitive version through `overrides` in package.json — the mechanism
      # already used there for postcss and sharp, and a real fix rather than an
      # exception — or, when no patched version exists, replace the line below
      # with an explicit id allowlist:
      #   npm audit --omit=dev --audit-level=moderate --json > audit.json || true
      #   node -e '...'   # fail unless every advisory id is in ACCEPTED
      # so that "we accept GHSA-xxxx because <reason>" is visible in the diff.
      - name: npm audit
        run: cd frontend && npm audit --omit=dev --audit-level=moderate

  backend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Install dependencies
        run: cd backend && pip install --no-deps -r requirements.lock
      # A real gate. Scoped to requirements.lock rather than the whole runner
      # environment on purpose: the environment also holds pip, setuptools and
      # wheel, which the runner image pins and this project neither declares
      # nor ships. Auditing those turns the gate into a report on GitHub's
      # image, which is exactly how it ended up waved through before.
      # The lock, not requirements.txt: `-r requirements.txt` resolves each
      # `>=` to today's newest release and audits that, not what the image
      # installs. Measured 2026-09-14: requirements.txt "No known
      # vulnerabilities", requirements.lock 46 in 8 packages (IS-17).
      # --no-deps --disable-pip audits the pinned list as written.
      #
      # Accepted advisories: none.
      #
      # pip-audit does have a per-advisory ignore, so accept one by id and
      # reason rather than by `continue-on-error`:
      #   pip-audit --strict --desc -r requirements.lock --no-deps --disable-pip \
      #     --ignore-vuln PYSEC-0000-0   # <reason it is not reachable here>
      - name: pip audit
        run: cd backend && pip-audit --strict --desc -r requirements.lock --no-deps --disable-pip
