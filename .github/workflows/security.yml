name: Security Scan

# Manual-dispatch only: this repo is out of GitHub Actions minutes. The weekly
# cron is disabled for the same reason — a schedule spends minutes with nobody
# asking. Run it from the Actions tab, or `gh workflow run security.yml`.
# To restore automatic runs, put the triggers below back.
on:
  workflow_dispatch:

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: npm audit
        run: cd frontend && npm audit --production --audit-level=moderate
        continue-on-error: true

  backend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt
      - name: pip audit
        run: cd backend && pip-audit -r requirements.txt
        continue-on-error: true
