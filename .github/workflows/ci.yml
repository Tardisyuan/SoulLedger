name: CI

# Manual-dispatch only: this repo is out of GitHub Actions minutes, so pushes
# and pull requests must not spend them. Run it from the Actions tab, or
# `gh workflow run ci.yml --ref <branch>`. To restore automatic runs, put the
# `push:`/`pull_request:` triggers below back.
on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-key-not-for-production
      DEBUG: 'true'
      DATABASE_URL: postgres://soulledger:soulledger@localhost:5432/soulledger_test
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: soulledger_test
          POSTGRES_USER: soulledger
          POSTGRES_PASSWORD: soulledger
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U soulledger"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Check migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: |
          cd backend
          python manage.py migrate
          python -m pytest --tb=short -q
      - name: Lint
        run: |
          cd backend
          pip install ruff
          ruff check .
      # Blocks. Scoped to requirements.txt rather than the whole environment,
      # which is what makes blocking viable: the bare `pip-audit --strict` this
      # replaces also swept in pip and setuptools from the runner image, and
      # the one standing finding (PYSEC-2026-3447, sdist MANIFEST.in exclusions
      # bypassed by Unicode normalisation) was in setuptools — a build-time
      # toolchain package this project neither declares nor ships, unreachable
      # here because nothing builds an sdist. Waiting for the runner image to
      # carry setuptools 83 was waiting on the wrong thing; the finding was
      # never about this project's dependencies.
      #
      # Accepted advisories: none.
      #
      # To accept one, name it — `--ignore-vuln <id>` with the reason beside
      # it. Not `continue-on-error`, which accepts everything that ever lands.
      - name: Security scan
        run: |
          cd backend
          pip install pip-audit
          pip-audit --strict --desc -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Lint
        run: |
          cd frontend
          npm run lint
      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # Must be `test:coverage`, not `test`. jest.config.js carries a
      # coverageThreshold, but jest only evaluates it when --coverage is
      # passed — a bare `npm test` reports a green suite and never looks at
      # the threshold at all.
      - name: Test
        run: |
          cd frontend
          npm run test:coverage
      # Blocks. The Next.js major this was waiting on turned out not to be
      # needed: next is on 16.x and sharp is pinned forward by an override, so
      # the two findings that once required `npm audit fix --force` are gone
      # and the audit is clean at every severity.
      #
      # Accepted advisories: none.
      #
      # npm audit has no per-advisory ignore flag, so if one ever has to be
      # accepted, do not reinstate `continue-on-error` and do not lower
      # `--audit-level` — both wave through far more than the advisory in
      # question. Prefer an `overrides` entry in package.json forcing a patched
      # transitive version (already how postcss and sharp are handled); failing
      # that, gate on `npm audit --json` filtered against an explicit id
      # allowlist. See .github/workflows/security.yml for the same note.
      - name: Security scan
        run: |
          cd frontend
          npm audit --audit-level=high

  # One leg per Playwright project, in parallel. Serial would be ~3x the wall
  # clock for no benefit, and a matrix keeps each engine's report separate so
  # a red run names the engine in the job title rather than in the log.
  # `fail-fast: false` because "chromium passes, firefox does not" is the whole
  # reason for having more than one engine — cancelling the others on the first
  # failure would throw away exactly the signal being bought here.
  # `browser` is what gets installed and is not always `project`: mobile-chrome
  # is Pixel 5 emulation running on the chromium build, so installing firefox
  # for it would download a browser it never launches.
  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: mobile-chrome
            browser: chromium
    name: e2e (${{ matrix.project }})
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run E2E tests
        run: |
          cd frontend
          npx playwright test --project=${{ matrix.project }}
      # upload-artifact@v4 rejects two uploads with the same name, so the
      # project has to be part of it.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: frontend/playwright-report/
          retention-days: 7
