name: CI

# Manual-dispatch only: this repo is out of GitHub Actions minutes, so pushes
# and pull requests must not spend them. Run it from the Actions tab, or
# `gh workflow run ci.yml --ref <branch>`. To restore automatic runs, put the
# `push:`/`pull_request:` triggers below back.
on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-key-not-for-production
      DEBUG: 'true'
      DATABASE_URL: postgres://soulledger:soulledger@localhost:5432/soulledger_test
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: soulledger_test
          POSTGRES_USER: soulledger
          POSTGRES_PASSWORD: soulledger
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U soulledger"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Check migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: |
          cd backend
          python manage.py migrate
          python -m pytest --tb=short -q
      - name: Lint
        run: |
          cd backend
          pip install ruff
          ruff check .
      # Reports but does not block, same as the frontend scan below. The only
      # finding is PYSEC-2026-3447 in setuptools, a build-time toolchain
      # package: MANIFEST.in exclusions can be bypassed by Unicode
      # normalisation when building an sdist. This project does not build or
      # publish sdists, so it is not reachable here. Restore the gate when
      # setuptools 83 is available in the runner image.
      - name: Security scan
        continue-on-error: true
        run: |
          cd backend
          pip install pip-audit
          pip-audit --strict --desc

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Lint
        run: |
          cd frontend
          npm run lint
      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # Must be `test:coverage`, not `test`. jest.config.js carries a
      # coverageThreshold, but jest only evaluates it when --coverage is
      # passed — a bare `npm test` reports a green suite and never looks at
      # the threshold at all.
      - name: Test
        run: |
          cd frontend
          npm run test:coverage
      # Reports but does not block. `npm audit fix` cleared ten of the twelve
      # findings without touching package.json — only transitive versions in
      # the lockfile moved. The remaining two (next, and sharp underneath it)
      # need `npm audit fix --force`, i.e. a Next.js major, which is not a
      # change to make in passing. Restore the gate once that upgrade is
      # planned; until then the findings stay visible in the log.
      - name: Security scan
        continue-on-error: true
        run: |
          cd frontend
          npm audit --audit-level=high

  # One leg per Playwright project, in parallel. Serial would be ~3x the wall
  # clock for no benefit, and a matrix keeps each engine's report separate so
  # a red run names the engine in the job title rather than in the log.
  # `fail-fast: false` because "chromium passes, firefox does not" is the whole
  # reason for having more than one engine — cancelling the others on the first
  # failure would throw away exactly the signal being bought here.
  # `browser` is what gets installed and is not always `project`: mobile-chrome
  # is Pixel 5 emulation running on the chromium build, so installing firefox
  # for it would download a browser it never launches.
  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: mobile-chrome
            browser: chromium
    name: e2e (${{ matrix.project }})
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run E2E tests
        run: |
          cd frontend
          npx playwright test --project=${{ matrix.project }}
      # upload-artifact@v4 rejects two uploads with the same name, so the
      # project has to be part of it.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: frontend/playwright-report/
          retention-days: 7
