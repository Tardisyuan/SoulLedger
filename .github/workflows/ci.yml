name: CI

# Manual-dispatch only: this repo is out of GitHub Actions minutes, so pushes
# and pull requests must not spend them. Run it from the Actions tab, or
# `gh workflow run ci.yml --ref <branch>`. To restore automatic runs, put the
# `push:`/`pull_request:` triggers below back.
on:
  workflow_dispatch:

# Least privilege for the job token (audit IS-19, 2026-09-14). Nothing here
# writes to the repository, comments, or publishes: every job checks out, runs
# a gate, and (e2e) uploads an artifact, which uses the Actions runtime token,
# not GITHUB_TOKEN. Measured 2026-09-14, the repository default is already
# `read` (`gh api repos/Tardisyuan/SoulLedger/actions/permissions/workflow`),
# so this changes nothing today. It is here so the answer lives in the file:
# a settings toggle, a fork, or a copy of this workflow into another repository
# would otherwise hand every step a write token without any diff to review.
#
# Actions are pinned to the commit their major tag pointed at when this was
# written (resolved via `gh api repos/<action>/git/ref/tags/<major>`), with the
# exact release beside it. A tag can be moved; a SHA cannot. Bump by resolving
# again, not by editing the comment.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-key-not-for-production
      DEBUG: 'true'
      DATABASE_URL: postgres://soulledger:soulledger@localhost:5432/soulledger_test
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: soulledger_test
          POSTGRES_USER: soulledger
          POSTGRES_PASSWORD: soulledger
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U soulledger"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd backend
          pip install --no-deps -r requirements.lock
      - name: Check migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: |
          cd backend
          python manage.py migrate
          python -m pytest --tb=short -q
      # ruff's version comes from requirements-dev.txt — the same pin the local
      # backend/.venv and the pre-push hook use. This used to install ruff
      # unpinned, i.e. whatever was newest on the day of the run.
      - name: Lint
        run: |
          cd backend
          pip install --no-deps -r requirements-dev.txt
          ruff check .
      # Blocks. Scoped to requirements.lock — what the image installs; auditing
      # requirements.txt resolved its `>=` to today's newest releases (IS-17) —
      # rather than the whole environment,
      # which is what makes blocking viable: the bare `pip-audit --strict` this
      # replaces also swept in pip and setuptools from the runner image, and
      # the one standing finding (PYSEC-2026-3447, sdist MANIFEST.in exclusions
      # bypassed by Unicode normalisation) was in setuptools — a build-time
      # toolchain package this project neither declares nor ships, unreachable
      # here because nothing builds an sdist. Waiting for the runner image to
      # carry setuptools 83 was waiting on the wrong thing; the finding was
      # never about this project's dependencies.
      #
      # Accepted advisories: none.
      #
      # To accept one, name it — `--ignore-vuln <id>` with the reason beside
      # it. Not `continue-on-error`, which accepts everything that ever lands.
      - name: Security scan
        run: |
          cd backend
          pip install pip-audit
          pip-audit --strict --desc -r requirements.lock --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      # Installed at the workspace root, not in `frontend`. `frontend` is an
      # npm workspace and depends on `@soulledger/core`, which lives in
      # `packages/core` — outside `frontend`, so `cd frontend && npm ci` cannot
      # see it. The root lockfile is the only lockfile; frontend no longer has
      # one.
      - name: Install dependencies
        run: npm ci
      # `@soulledger/core` has its own tsconfig and its own eslint config; the
      # frontend's `eslint .` cannot reach outside its base path, so a job that
      # only ran the frontend's gates would be checking 5,196 fewer lines than
      # the day before the package existed.
      - name: Typecheck @soulledger/core
        run: npm run typecheck --workspace @soulledger/core
      - name: Lint @soulledger/core
        run: npm run lint --workspace @soulledger/core
      # The third core gate, missing here until 2026-09-14 (audit IS-16) while
      # `.git/hooks/pre-push` ran it. Not covered by the other two:
      # `domBoundary.test.ts` / `nodeGlobals.test.ts` assert that DOM and Node
      # globals stay unresolvable (typecheck passes on empty interfaces), and
      # `generatedSchemaIsCurrent.test.ts` is the only check that
      # `src/api/generated/schema.ts` matches the committed OpenAPI document.
      #
      # Plain `test`, not `test:coverage`: core no longer carries its own
      # coverage floor (that gate measured only the ~7 files core has its own
      # vitest tests for — 9%, because the denominator was core's whole
      # source). Core's real coverage is now measured by the frontend jest run
      # below, which as of 2026-09-14 has `rootDir` at the repo root and can
      # see `packages/core/src` — see `frontend/jest.config.js`.
      - name: Test @soulledger/core
        run: npm run test --workspace @soulledger/core
      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Lint
        run: |
          cd frontend
          npm run lint
      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # Must be `test:coverage`, not `test`. jest.config.js carries a
      # coverageThreshold, but jest only evaluates it when --coverage is
      # passed — a bare `npm test` reports a green suite and never looks at
      # the threshold at all.
      - name: Test
        run: |
          cd frontend
          npm run test:coverage
      # Blocks. The Next.js major this was waiting on turned out not to be
      # needed: next is on 16.x and sharp is pinned forward by an override, so
      # the two findings that once required `npm audit fix --force` are gone
      # and the audit is clean at every severity.
      #
      # Accepted advisories: none.
      #
      # npm audit has no per-advisory ignore flag, so if one ever has to be
      # accepted, do not reinstate `continue-on-error` and do not lower
      # `--audit-level` — both wave through far more than the advisory in
      # question. Prefer an `overrides` entry in package.json forcing a patched
      # transitive version (already how postcss and sharp are handled); failing
      # that, gate on `npm audit --json` filtered against an explicit id
      # allowlist. See .github/workflows/security.yml for the same note.
      - name: Security scan
        run: |
          cd frontend
          npm audit --audit-level=high

  # The soul app (Expo). JS gates only: typecheck, lint, jest (jest-expo, no
  # simulator). Native builds are not part of CI — they need Xcode / the
  # Android SDK and are verified on simulators by hand for now.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck mobile
        run: npm run typecheck --workspace @soulledger/mobile
      - name: Lint mobile
        run: npm run lint --workspace @soulledger/mobile
      - name: Test mobile
        run: npm run test --workspace @soulledger/mobile

  # One leg per Playwright project, in parallel. Serial would be ~3x the wall
  # clock for no benefit, and a matrix keeps each engine's report separate so
  # a red run names the engine in the job title rather than in the log.
  # `fail-fast: false` because "chromium passes, firefox does not" is the whole
  # reason for having more than one engine — cancelling the others on the first
  # failure would throw away exactly the signal being bought here.
  # `browser` is what gets installed and is not always `project`: mobile-chrome
  # is Pixel 5 emulation running on the chromium build, so installing firefox
  # for it would download a browser it never launches.
  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: mobile-chrome
            browser: chromium
    name: e2e (${{ matrix.project }})
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      # Installed at the workspace root, not in `frontend`. `frontend` is an
      # npm workspace and depends on `@soulledger/core`, which lives in
      # `packages/core` — outside `frontend`, so `cd frontend && npm ci` cannot
      # see it. The root lockfile is the only lockfile; frontend no longer has
      # one.
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps ${{ matrix.browser }}
      # Built, not `next dev`. `playwright.config.ts`'s `webServer` now runs
      # `npm run start:e2e`, which serves this output — see the long note there
      # for why: the dev server compiles routes on demand, so every
      # `waitForLoadState("networkidle")` was really waiting on a compile, and
      # which route lost that race changed run to run.
      - name: Build
        run: |
          cd frontend
          npm run build
      - name: Run E2E tests
        run: |
          cd frontend
          npx playwright test --project=${{ matrix.project }}
      # upload-artifact@v4 rejects two uploads with the same name, so the
      # project has to be part of it.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: frontend/playwright-report/
          retention-days: 7
