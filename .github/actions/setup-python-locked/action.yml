name: Set up Python and install the locked backend
description: >-
  Python 3.11 with the pip cache, then the backend's requirements.lock and requirements-dev.txt with `--no-deps`.
  The lock is every transitive dependency at `==`, the same file the Dockerfile installs, so CI tests what the
  image ships; requirements-dev.txt brings the pinned ruff and pytest-xdist. Needs a checkout first.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install dependencies
      shell: bash
      working-directory: backend
      run: pip install --no-deps -r requirements.lock -r requirements-dev.txt
