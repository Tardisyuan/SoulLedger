# Production overrides. Only nginx publishes ports; backend and frontend are
# reached through it. `SECRET_KEY`, `DB_PASSWORD`, `REDIS_PASSWORD`,
# `ALLOWED_HOSTS`, `ENCRYPTION_KEY`, `NEXT_PUBLIC_API_URL` come from the root
# `.env` (see .env.example) — the base file reads them.
services:
  db:
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m

  pgbouncer:
    # A tag that exists. `1.23.1` never did (Docker Hub has `v1.23.1-p0..p3`),
    # so this merge could not start — measured 2026-09-13, "manifest unknown".
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DATABASE_URL: postgres://soulledger:${DB_PASSWORD}@db:5432/soulledger
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      POOL_MODE: transaction
      ADMIN_USERS: soulledger
      # postgres:16 stores passwords as scram-sha-256; the image's default
      # md5 fails the server login with "wrong password type" and the backend
      # restart-loops on migrate (measured 2026-09-13).
      AUTH_TYPE: scram-sha-256
    restart: always
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m

  backend:
    environment:
      DATABASE_URL: postgres://soulledger:${DB_PASSWORD}@pgbouncer:5432/soulledger
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      # nginx is the one proxy in front; X-Forwarded-For is trusted one hop.
      TRUSTED_PROXY_COUNT: "1"
      # pgbouncer in transaction mode cannot keep a server-side cursor alive
      # across statements, and `.iterator()` (ledger export, ledger and
      # death-sync tasks) opens one (IS-13).
      DISABLE_SERVER_SIDE_CURSORS: "true"
    depends_on:
      - pgbouncer
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             python manage.py setup_scheduled_tasks &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m

  celery:
    environment:
      DATABASE_URL: postgres://soulledger:${DB_PASSWORD}@pgbouncer:5432/soulledger
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      DISABLE_SERVER_SIDE_CURSORS: "true"
    depends_on:
      - pgbouncer
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m

  celery-beat:
    environment:
      DATABASE_URL: postgres://soulledger:${DB_PASSWORD}@pgbouncer:5432/soulledger
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      DISABLE_SERVER_SIDE_CURSORS: "true"
    depends_on:
      - pgbouncer
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m

  synapse:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m

  # Nightly pg_dump. It lived in the base file behind `profiles: [production]`,
  # and nothing — scripts/deploy.sh included — ever passed `--profile`, so it
  # never started; had it started, the script read DB_HOST instead of the
  # PGHOST passed here and dumped from localhost (IS-15). Being in this file
  # is what makes it production-only now.
  #
  # Failure is visible three ways: the first backup runs at start and a
  # failure exits the container (restart loop in `docker compose ps`); cron
  # output goes to the container's stdout (`docker compose logs backup`); and
  # the healthcheck turns unhealthy when the newest good dump (db or media) is
  # older than 26 hours — the signal an external monitor should watch.
  #
  # media_files is mounted read-only here too: uploaded avatars are user data
  # a db dump doesn't cover, and MEDIA_DIR tells backup-db.sh to tar it
  # alongside the db dump, same partial-then-rename and non-zero-exit-on-
  # failure behavior, same retention.
  backup:
    image: postgres:16-alpine
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
      - media_files:/media:ro
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: soulledger
      PGUSER: soulledger
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MEDIA_DIR: /media
    entrypoint: ["sh", "-c"]
    command:
      - >
        /scripts/backup-db.sh /backups &&
        echo '0 2 * * * /scripts/backup-db.sh /backups > /proc/1/fd/1 2>&1' > /etc/crontabs/root &&
        exec crond -f -l 8
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'soulledger_*.sql.gz' -mmin -1560 | grep -q . && find /backups -name 'soulledger_media_*.tar.gz' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      start_period: 5m
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # Let's Encrypt renewal (webroot). First issuance is a manual step that
  # needs the real domain — docs/DEPLOYMENT.md. Every 12 hours `certbot renew`;
  # a renewal that deploys a new certificate touches /etc/letsencrypt/.deployed
  # and nginx (below) reloads when it sees that marker.
  #
  # Failure is visible: the exit code is logged (`docker compose logs certbot`,
  # "certbot renew FAILED exit=N"), and the healthcheck is unhealthy when there
  # is no certificate at all or the last successful `renew` is over 25 hours
  # old. The container keeps running on failure on purpose: a restart loop
  # would retry validation into Let's Encrypt's failed-validation rate limit.
  certbot:
    image: certbot/certbot:v5.8.0
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["sh", "-c"]
    command:
      - |
        trap exit TERM
        while :; do
          certbot renew --non-interactive --webroot -w /var/www/certbot --deploy-hook 'touch /etc/letsencrypt/.deployed'
          rc=$$?
          if [ "$$rc" -eq 0 ]; then
            touch /etc/letsencrypt/.renew-ok
          else
            echo "certbot renew FAILED exit=$$rc" >&2
          fi
          sleep 43200 & wait $$!
        done
    healthcheck:
      test: ["CMD-SHELL", "ls /etc/letsencrypt/live/*/fullchain.pem >/dev/null 2>&1 && find /etc/letsencrypt/.renew-ok -mmin -1500 | grep -q ."]
      interval: 5m
      timeout: 10s
      start_period: 5m
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # A complete nginx.conf (events{} + http{}), so it replaces the main file.
      # A bind-mount source that does not exist becomes an empty directory and
      # nginx dies on it; a file with events{} under conf.d/ is a syntax error
      # (IS-09). tests/test_production.py checks the source exists.
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
      # Uploaded avatars, written by the backend at MEDIA_ROOT (/app/media).
      - media_files:/var/www/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME challenges certbot writes; nginx.conf serves them from here.
      - certbot_www:/var/www/certbot:ro
    # nginx plus a watcher: reload once certbot's deploy-hook has touched the
    # marker, so a renewed certificate is served without a manual step.
    command:
      - /bin/sh
      - -c
      - |
        touch /tmp/.reloaded
        while :; do
          sleep 300
          if [ /etc/letsencrypt/.deployed -nt /tmp/.reloaded ]; then
            echo "certificate renewed; reloading nginx"
            nginx -s reload && touch /tmp/.reloaded
          fi
        done &
        exec nginx -g 'daemon off;'
    depends_on:
      - frontend
      - backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  certbot_www:
