# Production overrides. Only nginx publishes ports; backend and frontend are
# reached through it. `SECRET_KEY`, `DB_PASSWORD`, `REDIS_PASSWORD`,
# `ALLOWED_HOSTS`, `ENCRYPTION_KEY`, `NEXT_PUBLIC_API_URL` come from the root
# `.env` (see .env.example) — the base file reads them.
services:
  db:
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    environment:
      DATABASE_URL: postgres://soulledger:${DB_PASSWORD}@db:5432/soulledger
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      POOL_MODE: transaction
      ADMIN_USERS: soulledger
    restart: always
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m

  backend:
    environment:
      DATABASE_URL: postgres://soulledger:${DB_PASSWORD}@pgbouncer:5432/soulledger
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      # nginx is the one proxy in front; X-Forwarded-For is trusted one hop.
      TRUSTED_PROXY_COUNT: "1"
      # pgbouncer in transaction mode cannot keep a server-side cursor alive
      # across statements, and `.iterator()` (ledger export, ledger and
      # death-sync tasks) opens one (IS-13).
      DISABLE_SERVER_SIDE_CURSORS: "true"
    depends_on:
      - pgbouncer
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m

  celery:
    environment:
      DATABASE_URL: postgres://soulledger:${DB_PASSWORD}@pgbouncer:5432/soulledger
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      DISABLE_SERVER_SIDE_CURSORS: "true"
    depends_on:
      - pgbouncer
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m

  celery-beat:
    environment:
      DATABASE_URL: postgres://soulledger:${DB_PASSWORD}@pgbouncer:5432/soulledger
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      DISABLE_SERVER_SIDE_CURSORS: "true"
    depends_on:
      - pgbouncer
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # A complete nginx.conf (events{} + http{}), so it replaces the main file.
      # This used to mount a root `./nginx.conf` that does not exist — docker
      # then creates an empty directory of that name and nginx dies on it —
      # and into conf.d/, where a file with events{} is a syntax error (IS-09).
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
