# Who may reach /admin/ (included by nginx.conf). Default: loopback and private ranges only,
# i.e. through a VPN or an SSH tunnel. Add the office / VPN egress address before go-live:
#   allow 203.0.113.7;
# Keep `deny all;` last: nginx stops at the first allow/deny that matches.
allow 127.0.0.1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
deny all;
