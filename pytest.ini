[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = backend
python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*
# --cov takes the importable package name, not a path. `backend/apps` was
# resolved relative to the *current directory*, so it only matched when pytest
# ran from the repo root — CI and the CLAUDE.md workflow both `cd backend`
# first, where it matched nothing, reported 0.00% and tripped --cov-fail-under
# on every green run. `apps` resolves via `pythonpath = backend` below and so
# measures the same 9671 statements from either directory.
addopts = -v --tb=short --cov=apps --cov-report=term-missing --cov-fail-under=40 --cov-branch --import-mode=importlib
asyncio_mode = auto
testpaths = backend
markers =
    django_db: mark test as needing database access
    xfail: mark test as expected failure
    slow: mark test as slow running
    transaction: mark test as using TransactionTestCase
