[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = backend
# The bare `tests.py` is load-bearing: the 12 backend/apps/*/tests.py modules
# (339 of the 1979 collected tests, measured) match no default pattern and are
# collected *only* because it is listed here. Deleting it reads like removing a
# redundant pattern; it actually drops those 339 tests from every run, and a
# test that is never collected cannot fail, so the build stays green.
# backend/tests/test_collection_scope.py asserts both trees stay collected, so
# that edit fails loudly instead.
python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*
# --cov takes the importable package name, not a path. `backend/apps` was
# resolved relative to the *current directory*, so it only matched when pytest
# ran from the repo root — CI and the CLAUDE.md workflow both `cd backend`
# first, where it matched nothing, reported 0.00% and tripped --cov-fail-under
# on every green run. `apps` resolves via `pythonpath = backend` below and so
# measures the same 9671 statements from either directory.
#
# --cov-fail-under is a ratchet, not an aspiration. It sat at 40 while the
# suite actually measured 87.04%, i.e. coverage could have halved without the
# gate noticing — a check that can only fire after the damage is catastrophic
# is not a check. 80 sits just under the measured figure with enough slack
# that a legitimately uncovered new module does not turn the build red on the
# day it lands. Raise it when the measured number moves up; never lower it to
# make a red build green.
addopts = -v --tb=short --cov=apps --cov-report=term-missing --cov-fail-under=80 --cov-branch --import-mode=importlib
asyncio_mode = auto
testpaths = backend
markers =
    django_db: mark test as needing database access
    xfail: mark test as expected failure
    slow: mark test as slow running
    transaction: mark test as using TransactionTestCase
