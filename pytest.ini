[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = backend
# The bare `tests.py` is load-bearing: the 12 backend/apps/*/tests.py modules
# (339 of the 1979 collected tests, measured) match no default pattern and are
# collected *only* because it is listed here. Deleting it reads like removing a
# redundant pattern; it actually drops those 339 tests from every run, and a
# test that is never collected cannot fail, so the build stays green.
# backend/tests/test_collection_scope.py asserts both trees stay collected, so
# that edit fails loudly instead.
python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*
# --cov takes the importable package name, not a path. `backend/apps` was
# resolved relative to the *current directory*, so it only matched when pytest
# ran from the repo root — CI and the CLAUDE.md workflow both `cd backend`
# first, where it matched nothing, reported 0.00% and tripped --cov-fail-under
# on every green run. `apps` resolves via `pythonpath = backend` below and so
# measures the same 9671 statements from either directory.
#
# --cov-fail-under is a ratchet, not an aspiration. It sat at 40 while the
# suite actually measured 87.04%, i.e. coverage could have halved without the
# gate noticing — a check that can only fire after the damage is catastrophic
# is not a check. 80 sits just under the measured figure with enough slack
# that a legitimately uncovered new module does not turn the build red on the
# day it lands. Raise it when the measured number moves up; never lower it to
# make a red build green.
# -p apps.audit.oncommit_guard:审计信号用 transaction.on_commit 写日志,而
# `django_db` 的事务最后会回滚 —— 那些回调永不执行。于是任何在这种上下文里
# 断言「没有审计日志」的测试都是**无条件通过**的。那个插件在查询发生的那一行
# 抛异常。它必须挂在 addopts 上而不是某个 conftest 里:审计断言散落在
# `apps/*/tests.py` 与 `tests/` 两棵树里,没有哪个 conftest 同时覆盖两边。
addopts = -v --tb=short --cov=apps --cov-report=term-missing --cov-fail-under=80 --cov-branch --import-mode=importlib -p apps.audit.oncommit_guard -p apps.core.lock_join_guard
asyncio_mode = auto
# pytest-django 在 DROP DATABASE 失败时只发一条 PytestWarning,运行照样 exit 0,
# 而 test_soulledger 就留在 115 上 —— 2026-09-26 三次全量都这样,警告埋在两千多条
# warning 里没人看见。升成 error 让它在测试报告里变成一条 teardown ERROR、退出码非 0。
# 根因的修复在根 conftest.py 的 django_db_setup;这一行只负责让下一个泄漏的连接不再沉默。
#
# 下面五条把 2026-09-29 清掉的 11,786 条 warning 钉成 error,各对应一种已修的来源:
#   DeprecationWarning:apps      —— 项目自己的代码调用已废弃的 API(当时 7,259 条
#                                   redis `setex`,apps/perm/cache.py)。只管 `apps.*`
#                                   模块发出的,第三方库自己的废弃警告不在此列。
#   RemovedInDjango60Warning     —— `CheckConstraint(check=…)`;升 Django 6 时这是报错。
#   UnorderedObjectListWarning   —— 分页一个无序 queryset:翻页会重复或漏行,是真缺陷。
#   InsecureKeyLengthWarning     —— SECRET_KEY 短于 32 字节,PyJWT 每次签/验都警告
#                                   (当时 4,519 条)。测试用的 key 由环境给:ci.yml 与
#                                   pre-push 钩子都给一个 ≥32 字节的。
#   CacheKeyWarning              —— 缓存键带空白,换成 memcached 会直接报错。
# 已知仍剩的:asgiref / 第三方库的少量 warning,不在这五类里。
filterwarnings =
    error:Error when trying to teardown test databases:pytest.PytestWarning
    error::DeprecationWarning:apps
    error::django.utils.deprecation.RemovedInDjango60Warning
    error::django.core.paginator.UnorderedObjectListWarning
    error::jwt.warnings.InsecureKeyLengthWarning
    error::django.core.cache.backends.base.CacheKeyWarning
testpaths = backend
markers =
    django_db: mark test as needing database access
    xfail: mark test as expected failure
    slow: mark test as slow running
    transaction: mark test as using TransactionTestCase
    migration: runs migrations backwards and forwards (17-49 s each); pre-push skips these unless the push touches migrations or their harness
