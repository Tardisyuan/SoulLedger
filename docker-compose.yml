# Base file, production-shaped: no published ports, no host bind mounts, DEBUG
# unset. Compose merges override files by ADDING or REPLACING keys — nothing
# can remove one — so a port or a `./backend:/app` mount written here would
# survive into `-f docker-compose.yml -f docker-compose.production.yml` and
# bypass nginx with the host's source tree and its `backend/.env` (IS-03).
# Anything dev-only lives in docker-compose.override.yml, which a bare
# `docker compose up` reads automatically and the -f pairs do not.
#
# `${…}` values come from a root `.env` (see .env.example); the names are the
# ones config/settings.py reads.

x-django-env: &django-env
  DATABASE_URL: postgres://soulledger:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/soulledger
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  # DEBUG is deliberately absent: settings.py then refuses to start without
  # ALLOWED_HOSTS, ENCRYPTION_KEY and a non-SQLite DATABASE_URL, which is the
  # check a production stack wants. The dev override sets DEBUG=true.
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
  # Uploaded avatars. The backend mounts the media_files volume here; in
  # production nginx mounts the same volume read-only and serves it as /media/.
  MEDIA_ROOT: /app/media
  # 灵魂聊天(docs/DEPLOYMENT.md「灵魂聊天」)。后端经 compose 网络直连 synapse,
  # 不绕 nginx —— admin API 只在这条路上可达。MATRIX_ENABLED 不设就是关着:
  # /me/chat/ 与 /chat/inbox/ 答 503,其余功能不受影响。
  MATRIX_ENABLED: ${MATRIX_ENABLED:-False}
  MATRIX_INTERNAL_URL: http://synapse:8008
  MATRIX_PUBLIC_BASEURL: ${MATRIX_PUBLIC_BASEURL:-}
  MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-}
  MATRIX_JWT_SECRET: ${MATRIX_JWT_SECRET:-}
  MATRIX_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:-}
  MATRIX_USER_SALT: ${MATRIX_USER_SALT:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soulledger
      POSTGRES_USER: soulledger
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulledger"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Root context: backend/Dockerfile copies `backend/…`, and .dockerignore
      # at the root keeps `backend/.env`, `test.db` and the coverage dumps out.
      context: .
      dockerfile: backend/Dockerfile
    # One image for backend, celery and celery-beat: the workers reuse this
    # tag instead of building the same Dockerfile two more times.
    image: soulledger-backend
    # Seeding goes through `manage.py seed_mythology`, not a standalone script.
    # This used to run `python scripts/seed_chinese_data.py`, a hand-maintained
    # second copy of the same realm and actor tables. Two copies meant every
    # change to the reference data (the DY_COURT_NN restructure in realms/0012,
    # for one) had to be applied twice by hand, and the copy nothing tested was
    # the one this deploy path ran. It also wrote its rows with tenant=NULL and
    # title="" — invisible to the tenant-scoped viewsets — and looked its realms
    # up through `Realm.objects`, which hides soft-deleted rows, so naming any
    # retired realm_code would have made it insert over a tombstone and die on
    # the unique constraint. The command matches on `all_objects`, assigns the
    # tenant, is idempotent, and is covered by tests/test_seed_mythology.py.
    # backend/tests/test_seed_entrypoint.py holds this line to the command.
    #
    # daphne, not `gunicorn config.wsgi`: WSGI never serves the channels
    # WebSocket routes, so /ws/ was dead in every deployment (IS-06).
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             python manage.py seed_mythology &&
             python manage.py setup_scheduled_tasks &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    environment: *django-env
    healthcheck:
      # python, not curl: python:*-slim has no curl. /health/ is the route
      # (config/urls.py); /api/v1/health/ never existed (IS-11).
      # X-Forwarded-Proto: with DEBUG unset Django redirects plain http to
      # https (SECURE_SSL_REDIRECT), urllib follows the 301 to
      # https://127.0.0.1:8000 and hangs in a TLS handshake against plaintext
      # daphne until the 10s timeout — "unhealthy" forever, and celery, which
      # waits for a healthy backend, never starts (measured 2026-09-13 on the
      # production merge). SECURE_PROXY_SSL_HEADER makes the header count as
      # https, so the probe reaches the view.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    image: soulledger-backend
    command: celery -A config.celery worker --loglevel=info
    environment: *django-env
    # Healthy backend = migrations applied. Started against db/redis alone,
    # beat raced the first migrate and died on a missing
    # django_celery_beat table (seen 2026-09-12); the worker has the same race.
    depends_on:
      backend:
        condition: service_healthy

  celery-beat:
    image: soulledger-backend
    command: celery -A config.celery beat --loglevel=info
    environment: *django-env
    depends_on:
      backend:
        condition: service_healthy

  # 灵魂聊天的 homeserver。不发布端口:客户端 API 只经 nginx 的 /_matrix 与
  # /_synapse/client,admin API 只有 compose 网络里的后端够得着。
  # /data/homeserver.yaml 不在仓库里(含密钥),由 scripts/synapse-init.sh 生成一次;
  # 没生成就 `up`,容器报 "Config file ... does not exist" 并反复重启,不影响其余服务。
  # 数据库是同一个 db 实例里的 `synapse` 库(C collation,属 `synapse` 角色,脚本建),直连 db 而不经
  # pgbouncer:production 的 pgbouncer 只配了 soulledger 库,而 Synapse 自带连接池
  # (cp_min/cp_max),再套一层没有收益。
  synapse:
    image: matrixdotorg/synapse:v1.161.0
    restart: unless-stopped
    volumes:
      - synapse_data:/data
      # 策略模块(soulledger_policy.py)与追加模板,只读。少了模块,灵魂拿自己的 token
      # 就能绕过全部聊天规则 —— 见 homeserver.soulledger.yaml 的 modules 段。
      - ./config/synapse:/modules:ro
    environment:
      PYTHONPATH: /modules
      # 下面这些只有 scripts/synapse-init.sh 用(generate 要 server_name;合并时把
      # ${...} 换成与后端相同的值)。Synapse 运行时只读 /data/homeserver.yaml,
      # 而那份文件里本来就是这些值,所以放在这里不多暴露什么。
      SYNAPSE_SERVER_NAME: ${MATRIX_SERVER_NAME:-}
      SYNAPSE_REPORT_STATS: "no"
      # `synapse` 库账号的密码(只拥有 synapse 库,不是超级用户;脚本建角色时用)。
      # 不设不影响其余服务 —— 只有 synapse-init.sh 会因为它缺失而拒绝。
      SYNAPSE_DB_PASSWORD: ${SYNAPSE_DB_PASSWORD:-}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-}
      MATRIX_PUBLIC_BASEURL: ${MATRIX_PUBLIC_BASEURL:-}
      MATRIX_JWT_SECRET: ${MATRIX_JWT_SECRET:-}
      MATRIX_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:-}
      # 书信推送回调(模板 homeserver.soulledger.yaml 里 push_url 的占位 MATRIX_PUSH_HOOK_URL):compose 网络内直连 backend,不经 nginx。
      # backend 必须在 ALLOWED_HOSTS 里;回调路径已在 SECURE_REDIRECT_EXEMPT(否则 301,推送静默失效)。
      MATRIX_PUSH_HOOK_URL: http://backend:8000/api/v1/chat/hooks/new-message/
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      # Root context: `frontend` is an npm workspace and its `@soulledger/core`
      # dependency lives in `packages/core`, outside `./frontend`.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Build-time: next.config.js inlines it. The browser must be able to
        # reach this URL, so in production it is the public one behind nginx.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    healthcheck:
      # busybox wget: node:*-alpine has no curl (IS-11). 127.0.0.1, not
      # localhost: alpine resolves that to ::1 and Next listens on IPv4 only
      # (measured 2026-09-12: "unhealthy" with localhost, 200 with 127.0.0.1).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - backend

volumes:
  postgres_data:
  # collectstatic output; nginx mounts it read-only as /static/ (IS-14).
  static_files:
  # Uploaded avatars (MEDIA_ROOT); nginx mounts it read-only as /media/.
  # Unlike static_files this is user data — back it up with the database.
  media_files:
  # Synapse 的签名密钥与媒体(聊天图片)。消息本身在 db 的 synapse 库里;
  # 签名密钥丢了等于换了一台 homeserver —— 与数据库一起备份。
  synapse_data:
