version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soulledger
      POSTGRES_USER: soulledger
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Uncomment ports for local dev only — never expose DB in production
    # ports:
    #   - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulledger"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Uncomment ports for local dev only — never expose Redis in production
    # ports:
    #   - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    # Seeding goes through `manage.py seed_mythology`, not a standalone script.
    # This used to run `python scripts/seed_chinese_data.py`, a hand-maintained
    # second copy of the same realm and actor tables. Two copies meant every
    # change to the reference data (the DY_COURT_NN restructure in realms/0012,
    # for one) had to be applied twice by hand, and the copy nothing tested was
    # the one this deploy path ran. It also wrote its rows with tenant=NULL and
    # title="" — invisible to the tenant-scoped viewsets — and looked its realms
    # up through `Realm.objects`, which hides soft-deleted rows, so naming any
    # retired realm_code would have made it insert over a tombstone and die on
    # the unique constraint. The command matches on `all_objects`, assigns the
    # tenant, is idempotent, and is covered by tests/test_seed_mythology.py.
    # backend/tests/test_seed_entrypoint.py holds this line to the command.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_mythology &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://soulledger:${DB_PASSWORD}@db:5432/soulledger
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    command: celery -A config.celery worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://soulledger:${DB_PASSWORD}@db:5432/soulledger
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - redis
      - db

  celery-beat:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    command: celery -A config.celery beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://soulledger:${DB_PASSWORD}@db:5432/soulledger
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - redis
      - db

  frontend:
    build:
      # Root context: `frontend` is an npm workspace and its `@soulledger/core`
      # dependency lives in `packages/core`, outside `./frontend`.
      context: .
      dockerfile: Dockerfile.frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3333:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend

  backup:
    image: postgres:16-alpine
    volumes:
      - ./scripts:/scripts
      - ./backups:/backups
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=soulledger
      - PGUSER=soulledger
      - PGPASSWORD=${DB_PASSWORD}
    entrypoint: /bin/sh
    command: >
      -c "echo '0 2 * * * /scripts/backup-db.sh /backups' > /etc/crontabs/root &&
          crond -f -l 2"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - production

volumes:
  postgres_data:
