# Exact versions the backend image and CI install. requirements.txt is the
# intent (top-level packages and ranges); this file is what gets deployed
# (IS-17). tests/test_the_image_installs_locked_versions.py checks every
# requirements.txt entry is pinned here inside its range.
#
# How this was produced (2026-09-14) — resolved, not upgraded: the versions
# are the ones installed in the environment the full backend suite passes in,
# resolved for the image's interpreter (Python 3.11, linux):
#
#   pip list --format=freeze > constraints.txt   # in that environment
#   uv pip compile requirements.txt -c constraints.txt \
#       --python-version 3.11 --python-platform x86_64-manylinux_2_28 \
#       --no-annotate --no-header -o requirements.lock
#
# (aarch64-manylinux_2_28 resolves to the identical set.) Two lines differ
# from that environment, both because it runs Python 3.12:
#   ipython: 9.12.0 requires Python >= 3.12, so it was left out of the
#     constraints and 9.17.1 is the 3.11 resolution. A dev REPL; nothing
#     imports it.
#   async-timeout: required by redis on Python < 3.11.3 only.
#
# To change a version: move the range in requirements.txt if needed, then
# rerun the command against an environment where the suite passes with it.
#
# 2026-09-14 security upgrade: pip-audit on this file reported 46 known
# vulnerabilities in 8 packages. Those 8 were raised to their fix versions in
# the constraints (click 8.3.3, cryptography 50.0.0, django 5.2.17,
# djangorestframework 3.17.2, idna 3.15, pillow 12.3.0, sqlparse 0.6.0,
# urllib3 2.7.0) and the same command re-run. pyopenssl was dropped from the
# constraints because 26.3.0 requires cryptography<50; it resolves to 26.4.0.
# No other line moved. The suite was run in a Python 3.11 venv built from
# this file, not in the environment above, which still has the old versions.
