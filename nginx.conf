# Complete nginx.conf — mount it at /etc/nginx/nginx.conf, never into conf.d/
# (a file with events{} there is a syntax error). Mounted by
# docker-compose.production.yml. It lived in infrastructure/ next to a second,
# independent production stack; that stack is gone (2026-09-13) because two
# copies meant every fix had to land twice and each broke on its own.
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    # `$request` includes the query string. The browser's WebSocket client
    # used to authenticate with `/ws/notifications/?token=<jwt>`, so under
    # `main` every connect wrote a live access token to disk (IS-10). /ws/ logs
    # with this one instead: method, path without the query, protocol.
    # error_log cannot be formatted and still prints the full request line when
    # the upstream fails, so the client now sends the token as its first frame
    # instead (packages/core/src/ws/client.ts). The backend still accepts
    # `?token=` from older clients, which is why this format stays.
    log_format ws_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # connect-src: the API is same-origin through this proxy ('self'); the
    # notifications socket is wss to the same host, named explicitly because
    # not every browser has let 'self' match ws/wss; *.sentry.io is the ingest
    # host for NEXT_PUBLIC_SENTRY_DSN (a self-hosted Sentry needs its own host
    # here). script-src/worker-src: frontend/instrumentation-client.ts
    # lazy-loads Sentry replay from its CDN, and replay compresses in a blob:
    # worker. Was `connect-src 'self'` only (IS-22).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://$host https://*.sentry.io; worker-src 'self' blob:; font-src 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # One server block, both listeners, so the routes cannot drift between an
    # http and an https copy. TLS is off until a certificate is mounted:
    # `listen 443 ssl` with no ssl_certificate is a fatal config error, which
    # is how the previous file kept nginx from starting at all (IS-09).
    # With certs in place, uncomment the four lines below. Django sends
    # HSTS and redirects http→https itself (SECURE_SSL_REDIRECT), so port 80
    # then only needs to exist for the ACME challenge.
    server {
        listen 80;
        # listen 443 ssl;
        # http2 on;
        # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
        server_name _;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Auth endpoints with stricter rate limiting
        location /api/v1/auth/ {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API endpoints with rate limiting
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            # nginx's default is 1m; avatar uploads go up to 5 MB
            # (apps/social/serializers.py AVATAR_MAX_BYTES). Non-file request
            # bodies are still capped at 2.5 MB by Django itself
            # (DATA_UPLOAD_MAX_MEMORY_SIZE default).
            client_max_body_size 6m;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket (channels, served by daphne). Without Upgrade/Connection
        # the handshake is a plain GET and /ws/ was unreachable (IS-06).
        location /ws/ {
            access_log /var/log/nginx/access.log ws_noquery;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # An idle socket must outlive nginx's 60s default read timeout.
            proxy_read_timeout 3600s;
        }

        # 灵魂聊天(Synapse)。App 走这里的客户端 API;后端经 compose 网络直连,
        # 不经过这里。admin API 只给后端用:`^~` 前缀优先于下面的正则,整段拒绝
        # (/_synapse/admin/v1/register 在 registration_shared_secret 之外没有别的门)。
        location ^~ /_synapse/admin {
            deny all;
        }
        # 联邦接口对外关掉:单 homeserver 不联邦(homeserver 的 federation_domain_whitelist
        # 为空,不与任何服务器互通)。/_matrix/federation 是服务器对服务器 API,/_matrix/key
        # 是给别的服务器取本机签名公钥用的 —— App 只用 /_matrix/client 与 /_matrix/media,
        # 两者都不经这两个前缀,所以这里 403 不影响聊天,只是不再向公网暴露用不上的面。
        location ^~ /_matrix/federation {
            deny all;
        }
        location ^~ /_matrix/key {
            deny all;
        }

        # 变量 + resolver(Docker 内置 DNS),而不是 upstream 块:upstream 在 nginx
        # 启动时解析,synapse 还没初始化或正在重启时整个 nginx 起不来、全站跟着挂;
        # 这样只是这两条路径答 502。变量里不带 URI,请求路径原样转发(Synapse
        # 要求不做 URI 规范化)。
        location ~ ^(/_matrix|/_synapse/client) {
            resolver 127.0.0.11 valid=30s;
            set $synapse_upstream http://synapse:8008;
            proxy_pass $synapse_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Synapse 的上传上限(max_upload_size)默认 50M;nginx 默认 1m。
            client_max_body_size 50m;
            # /sync 长轮询默认挂 30s,留余量。
            proxy_read_timeout 120s;
        }

        # Django admin and the health probe live on the backend too (IS-14).
        location /admin/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # collectstatic output, shared with the backend through the
        # static_files volume. Django itself does not serve /static/ when
        # DEBUG is off and whitenoise is not installed.
        location /static/ {
            alias /var/www/static/;
            expires 30d;
        }

        # Uploaded avatars (MEDIA_ROOT on the backend, the media_files volume
        # here). Same origin as the app, so the CSP's `img-src 'self'` covers
        # them and needs no widening. Every stored file is a re-encoded
        # PNG/JPEG/WebP under a random name, so the extension-derived type is
        # the real one; the server-level `nosniff` header applies because this
        # block adds no add_header of its own (one would drop all inherited
        # ones). Names never repeat — a new avatar is a new file — so caching
        # long is safe.
        location /media/ {
            alias /var/www/media/;
            expires 30d;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
