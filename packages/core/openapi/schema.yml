  /api/v1/workflows/{id}/advance/:
    post:
      operationId: v1_workflows_advance_create
      description: |-
        Manually advance workflow to next pending node.

        Moves the pointer only; the node being left is not decided and stays
        PENDING, so it can be returned to. Getting *past* an undecided node is
        `escalate`, which records the skip.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Approval Workflow.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalWorkflow'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalWorkflow'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalWorkflow'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
