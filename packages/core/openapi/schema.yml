          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        display_name:
          type: string
          description: Display name shown in the navbar (e.g. 系统管理员)
          maxLength: 100
        organization:
          type: integer
          nullable: true
          description: 所属组织：如 第一殿、冥王厅
        position:
          type: string
          description: 职位：如 第一殿殿主
