          - HUMAN
          - HUNGRY_GHOST
          - OTHER
        description: |-
          * `DIVINE` - Deva (Heaven Path)
          * `HUMAN` - Human (Human Path)
          * `ASURA` - Asura (Demigod Path)
          * `ANIMAL` - Animal (Beast Path)
