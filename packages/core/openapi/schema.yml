    VisibilityEnum:
      enum:
      - PUBLIC
      - TENANT
      - FOLLOWERS
      - PRIVATE
      type: string
      description: |-
        * `PUBLIC` - Public
        * `TENANT` - Tenant Only
        * `FOLLOWERS` - Followers Only
        * `PRIVATE` - Private
    WebhookConfig:
      type: object
      description: |-
        Serializer for WebhookConfig (hides signing_secret).

        ``create_time``, not ``created_at`` — WebhookConfig gets its audit
        timestamp from AuditUserFields, which names the field ``create_time``.
        Referencing a nonexistent field name here raised ImproperlyConfigured
        as soon as DRF built the field list, which happens for every action
        (list/retrieve/create/update) — this endpoint has never successfully
        served a single request, so there's no wire-format compatibility to
        preserve by keeping ``created_at`` as the JSON key via ``source=``.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
          description: Webhook callback URL (must be HTTPS in production)
          maxLength: 500
        is_active:
          type: boolean
        events:
          description: Event types to subscribe to. Empty = all events.
        max_retries:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        timeout_seconds:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        create_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - create_time
      - id
      - url
    WorkflowTemplate:
      type: object
      description: |-
        Serializer for WorkflowTemplate.

        ``priority`` is in ``fields`` deliberately and the omission would be
        silent: DRF drops unknown keys from ``request.data`` without complaint, so
        a template POSTed with ``"priority": 1`` from the editor would have been
        stored as 0 and answered 201, and every workflow built from it would have
        come out normal-priority with nothing anywhere saying why. That failure
        mode — an accepted request whose payload was quietly discarded — is the
        reason this field exists at the API layer at all, and
        ``tests/test_workflow_template_priority.py`` POSTs a 1 and reads the row
        back rather than trusting the 201.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Template name, e.g., 十殿审判流程
          maxLength: 255
        description:
          type: string
        civilization:
          $ref: '#/components/schemas/CivilizationEnum'
        case_type:
          $ref: '#/components/schemas/CaseTypeEnum'
        priority:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: 'Default priority for workflows built from this template: 0=normal,
            1=urgent, 2=critical'
        is_active:
          type: boolean
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTemplateNode'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        tenant:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - name
      - tenant
      - updated_at
    WorkflowTemplateList:
      type: object
      description: |-
        Lightweight serializer for listing templates.

        Deliberately omits `nodes` (the full node graph, source=`nodes_json` on
        the detail serializer below) — a list of every template's full node graph
        is the payload this serializer exists to avoid. `node_count` gives the
        one fact a list screen needs (how big is this template) without it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Template name, e.g., 十殿审判流程
          maxLength: 255
        description:
          type: string
        civilization:
          $ref: '#/components/schemas/CivilizationEnum'
        case_type:
          $ref: '#/components/schemas/CaseTypeEnum'
        priority:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: 'Default priority for workflows built from this template: 0=normal,
            1=urgent, 2=critical'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        node_count:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - name
      - node_count
    WorkflowTemplateNode:
      type: object
      description: |-
        Serializer for a single template node.

        These field names are the canonical spelling of a stored node — see
        ``apps/workflow/node_shape.py`` for why this shape and not the
        ``name/court/type/order`` one ``WORKFLOW_TEMPLATES`` uses.

        On *input* only this shape is accepted, so nothing new is written in the
        other one. On *output* the node is normalized first, because rows in the
        other shape can already exist: ``seed_workflow_templates`` wrote
        ``WORKFLOW_TEMPLATES`` verbatim into ``nodes_json`` until this change, and
        rendering such a row raised ``KeyError: 'node_name'`` from
        ``rest_framework/fields.py`` — a 500 on ``GET
        /api/v1/workflow/templates/{id}/``, the mirror image of the
        ``KeyError: 'name'`` the same split caused in ``create_from_judgment``.
        Both are held as regressions in ``tests/test_workflow_node_shape.py``.
      properties:
        id:
          type: string
        node_name:
          type: string
          maxLength: 255
        node_type:
          allOf:
          - $ref: '#/components/schemas/WorkflowTemplateNodeNodeTypeEnum'
          default: TRIAL
        court_code:
          type: string
          default: ''
          maxLength: 50
        approver_role:
          type: string
          default: ''
          maxLength: 20
        approver_type:
          allOf:
          - $ref: '#/components/schemas/WorkflowTemplateNodeApproverTypeEnum'
          default: ROLE
        node_order:
          type: integer
          default: 1
        on_pass:
          type: string
          nullable: true
        on_fail:
          type: string
          nullable: true
        position:
          type: object
          additionalProperties:
            type: number
            format: double
          nullable: true
      required:
      - node_name
    WorkflowTemplateNodeApproverTypeEnum:
      enum:
      - ACTOR
      - ROLE
      - SYSTEM
      type: string
      description: |-
        * `ACTOR` - ACTOR
        * `ROLE` - ROLE
        * `SYSTEM` - SYSTEM
    WorkflowTemplateNodeNodeTypeEnum:
      enum:
      - TRIAL
      - EVALUATION
      - APPEAL
      - FINAL
      - EXECUTION
      type: string
      description: |-
        * `TRIAL` - TRIAL
        * `EVALUATION` - EVALUATION
        * `APPEAL` - APPEAL
        * `FINAL` - FINAL
        * `EXECUTION` - EXECUTION
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: External-system API key, as `ApiKey <raw_key>`. The raw key is
        never stored — `ExternalApiKey.key_hash` holds its SHA-256.
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
