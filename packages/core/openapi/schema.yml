    User:
      type: object
      description: |-
        The serializer behind `PATCH /auth/profile/` — what a user may change
        about themselves.

        `role` and `tenant` were already locked. `organization` was not, and it is
        a foreign key with no tenant check: measured, a VIEWER could
        `PATCH /auth/profile/ {"organization": <an org belonging to tenant B>}`
        and get 200. Nothing downstream widened that into data access
        (`apps/perm/filters.py` never mentions `organization`, so `DataScopeFilter`
        does not read it), which is why this is a write-integrity hole rather than
        a privilege escalation — but "the field nobody reads today" is not a
        permission model.

        Kept writable rather than made read-only: moving between the organizations
        of one's own tenant is what this field is for. The scoping happens in
        `validate_organization`.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        role:
          type: string
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        display_name:
          type: string
          description: Display name shown in the navbar (e.g. 系统管理员)
          maxLength: 100
        organization:
          type: integer
          nullable: true
          description: 所属组织：如 第一殿、冥王厅
        position:
          type: string
          description: 职位：如 第一殿殿主
          maxLength: 100
      required:
      - id
      - is_active
      - role
      - username
    UserBatchUpdateResult:
      type: object
      description: |-
        `{"updated": N}` — what `batch_activate` and `batch_deactivate` return.

        Schema-only, never instantiated. `updated` is the row count from a single
        `QuerySet.update()`, so it counts rows the tenant filter actually reached,
        not the ids the caller sent — a caller passing ids from another tenant gets
        a smaller number, not an error.
      properties:
        updated:
          type: integer
      required:
      - updated
    UserCreate:
      type: object
      description: |-
        User serializer for creation with password handling.

        Non-ADMIN callers are constrained two ways (see ROLE_HIERARCHY above):
        - `tenant` is forced to the caller's own tenant — a client-supplied
          value for another tenant is rejected rather than silently honored.
        - `role` can never be more privileged than the caller's own role, which
          is what blocks a non-ADMIN from creating an ADMIN account (themselves
          or anyone else).
        ADMIN keeps its existing unrestricted behavior (any tenant, any role).
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          type: string
          maxLength: 20
        tenant:
          type: integer
          nullable: true
        organization:
          type: integer
          nullable: true
          description: 所属组织：如 第一殿、冥王厅
        position:
          type: string
          description: 职位：如 第一殿殿主
          maxLength: 100
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
      required:
      - id
      - password
      - username
    UserImportResult:
      type: object
      description: |-
        `{"created": N, "errors": [...]}` — the CSV import summary.

        Schema-only. `errors` is truncated to the first 50 rows by the view, so an
        empty list means "no failures" but a 50-long list does **not** mean exactly
        fifty; `created` is the only exact figure in this body.
      properties:
        created:
          type: integer
        errors:
          type: array
          items:
            type: string
      required:
      - created
      - errors
    UserManagement:
      type: object
      description: User serializer for list/retrieve operations in user management
        API.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          type: string
          maxLength: 20
        tenant:
          allOf:
          - $ref: '#/components/schemas/UserTenantRef'
          nullable: true
          readOnly: true
        organization:
          allOf:
          - $ref: '#/components/schemas/UserOrganizationRef'
          nullable: true
          readOnly: true
        position:
          type: string
          description: 职位：如 第一殿殿主
          maxLength: 100
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        create_time:
          type: string
          format: date-time
          readOnly: true
        avatar:
          type: string
          format: uri
          nullable: true
      required:
      - create_time
      - id
      - organization
      - tenant
      - username
    UserNotification:
      type: object
      description: |-
        分语言的类型按请求语言重渲染 title / message(见 `apps/notifications/messages.py`)。
        请求的语言不是三种之一,或行上没有 params(旧行),就返回存下来的原文。
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        notification_type:
          allOf:
          - $ref: '#/components/schemas/NotificationTypeEnum'
          readOnly: true
        is_read:
          type: boolean
        related_resource:
          type: string
          readOnly: true
          nullable: true
          description: e.g., 'workflow', 'judgment', 'soul'
        related_id:
          type: string
          readOnly: true
          nullable: true
          description: UUID of related resource
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - notification_type
      - related_id
      - related_resource
      - title
      - user
    UserNotificationList:
      type: object
      description: Lightweight serializer for listing notifications.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        message:
          type: string
        notification_type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        is_read:
          type: boolean
        related_resource:
          type: string
          nullable: true
          description: e.g., 'workflow', 'judgment', 'soul'
          maxLength: 50
        related_id:
          type: string
          nullable: true
          description: UUID of related resource
          maxLength: 36
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - title
    UserOrganizationRef:
      type: object
      description: |-
        The three keys `UserManagementSerializer.get_organization` returns.

        Note the third key is `name`, not `display_name` as on the tenant beside it.
        That asymmetry is in the models and is reproduced here rather than tidied,
        because this class's whole job is to say what the endpoint actually sends.
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
      required:
      - code
      - id
      - name
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        bio:
          type: string
        avatar:
          type: string
          format: uri
          nullable: true
          readOnly: true
        followers_count:
          type: integer
          readOnly: true
        following_count:
          type: integer
          readOnly: true
        post_count:
          type: integer
          readOnly: true
      required:
      - avatar
      - followers_count
      - following_count
      - id
      - post_count
      - user
      - username
    UserProfileUpdate:
      type: object
      description: |-
        Serializer for updating the profile bio. The avatar has its own upload
        endpoint (AvatarUploadSerializer).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        bio:
          type: string
      required:
      - id
    UserRole:
      type: object
      description: |-
        `{"role": "..."}` — the single-role body `own_roles` returns.

        Schema-only. Named for what it is: this endpoint is plural in its URL and
        singular in its body, because a user carries one role in this system.
      properties:
        role:
          type: string
      required:
      - role
    UserTenantRef:
      type: object
      description: |-
        The three keys `UserManagementSerializer.get_tenant` returns.

        Schema-only, never instantiated — the method builds the dict by hand. This
        is a **reference**, not the full tenant: it carries id, code and
        display_name and nothing else, which is what the user-management screens
        need to label a row without a second request.
      properties:
        id:
          type: integer
        code:
          type: string
        display_name:
          type: string
      required:
      - code
      - display_name
      - id
    UserUpdate:
      type: object
      description: |-
        User serializer for updates (email, role, is_active, organization, position).

        `tenant` is deliberately not in `fields` — a user's tenant can't be
        changed through this path at all, by ADMIN or otherwise.
      properties:
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          type: string
          maxLength: 20
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        organization:
          type: integer
          nullable: true
          description: 所属组织：如 第一殿、冥王厅
        position:
          type: string
          description: 职位：如 第一殿殿主
          maxLength: 100
    UserWithTenant:
      type: object
      description: User serializer with tenant info + role permissions for login response.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        role:
          type: string
          maxLength: 20
        tenant:
          allOf:
          - $ref: '#/components/schemas/LoginTenantRef'
          nullable: true
          readOnly: true
        display_name:
          type: string
          description: Display name shown in the navbar (e.g. 系统管理员)
          maxLength: 100
        permissions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - id
      - permissions
      - tenant
      - username
    VerdictEnum:
      enum:
      - PASSED
      - FAILED
      - PURGATORY
      - RETRY
      type: string
      description: |-
        * `PASSED` - Passed / Saved
        * `FAILED` - Failed / Condemned
        * `PURGATORY` - Purgatory / Intermediate
        * `RETRY` - Retry / Appeal
    VisibilityEnum:
      enum:
      - PUBLIC
      - TENANT
      - FOLLOWERS
      - PRIVATE
      type: string
      description: |-
        * `PUBLIC` - Public
        * `TENANT` - Tenant Only
        * `FOLLOWERS` - Followers Only
        * `PRIVATE` - Private
    WebhookConfig:
      type: object
      description: |-
        Serializer for WebhookConfig (hides signing_secret).

        ``create_time``, not ``created_at`` — WebhookConfig gets its audit
        timestamp from AuditUserFields, which names the field ``create_time``.
        Referencing a nonexistent field name here raised ImproperlyConfigured
        as soon as DRF built the field list, which happens for every action
        (list/retrieve/create/update) — this endpoint has never successfully
        served a single request, so there's no wire-format compatibility to
        preserve by keeping ``created_at`` as the JSON key via ``source=``.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
          description: Webhook callback URL (must be HTTPS in production)
          maxLength: 500
        is_active:
          type: boolean
        events:
          description: Event types to subscribe to. Empty = all events.
        max_retries:
          type: integer
        timeout_seconds:
          type: integer
        create_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - create_time
      - id
      - url
    WorkflowNodeAction:
      type: object
      description: Serializer for node approval action.
      properties:
        verdict:
          $ref: '#/components/schemas/NodeDecisionVerdictEnum'
        notes:
          type: string
          default: ''
        rejection_reason_for_soul:
          type: string
          default: ''
          maxLength: 2000
      required:
      - verdict
    WorkflowStats:
      type: object
      description: |-
        The dict `WorkflowService.get_workflow_stats` builds.

        Schema-only, never instantiated. `pending_nodes` is counted and
        `completed_nodes` is derived as `total - pending`, so the two always sum to
        `total_nodes` even for a status neither bucket names — see the note at
        `apps/workflow/services.py:726`. `progress_percent` is 0-100, not 0-1, and
        is a float because it is a ratio times 100, not a rounded percentage.
      properties:
        total_nodes:
          type: integer
        completed_nodes:
          type: integer
        pending_nodes:
          type: integer
        progress_percent:
          type: number
          format: double
      required:
      - completed_nodes
      - pending_nodes
      - progress_percent
      - total_nodes
    WorkflowStepRef:
      type: object
      properties:
        step_order:
          type: integer
        step_name:
          type: string
      required:
      - step_name
      - step_order
    WorkflowTemplate:
      type: object
      description: |-
        Serializer for WorkflowTemplate.

        ``priority`` is in ``fields`` deliberately and the omission would be
        silent: DRF drops unknown keys from ``request.data`` without complaint, so
        a template POSTed with ``"priority": 1`` from the editor would have been
        stored as 0 and answered 201, and every workflow built from it would have
        come out normal-priority with nothing anywhere saying why. That failure
        mode — an accepted request whose payload was quietly discarded — is the
        reason this field exists at the API layer at all, and
        ``tests/test_workflow_template_priority.py`` POSTs a 1 and reads the row
        back rather than trusting the 201.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Template name, e.g., 十殿审判流程
          maxLength: 255
        description:
          type: string
        civilization:
          $ref: '#/components/schemas/CivilizationEnum'
        case_type:
          $ref: '#/components/schemas/CaseTypeEnum'
        priority:
          type: integer
          description: 'Default priority for workflows built from this template: 0=normal,
            1=urgent, 2=critical'
        is_active:
          type: boolean
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTemplateNode'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        tenant:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - name
      - tenant
      - updated_at
    WorkflowTemplateList:
      type: object
      description: |-
        Lightweight serializer for listing templates.

        Deliberately omits `nodes` (the full node graph, source=`nodes_json` on
        the detail serializer below) — a list of every template's full node graph
        is the payload this serializer exists to avoid. `node_count` gives the
        one fact a list screen needs (how big is this template) without it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Template name, e.g., 十殿审判流程
          maxLength: 255
        description:
          type: string
        civilization:
          $ref: '#/components/schemas/CivilizationEnum'
        case_type:
          $ref: '#/components/schemas/CaseTypeEnum'
        priority:
          type: integer
          description: 'Default priority for workflows built from this template: 0=normal,
            1=urgent, 2=critical'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        node_count:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - name
      - node_count
    WorkflowTemplateNode:
      type: object
      description: |-
        Serializer for a single template node.

        These field names are the canonical spelling of a stored node — see
        ``apps/workflow/node_shape.py`` for why this shape and not the
        ``name/court/type/order`` one ``WORKFLOW_TEMPLATES`` uses.

        On *input* only this shape is accepted, so nothing new is written in the
        other one. On *output* the node is normalized first, because rows in the
        other shape can already exist: ``seed_workflow_templates`` wrote
        ``WORKFLOW_TEMPLATES`` verbatim into ``nodes_json`` until this change, and
        rendering such a row raised ``KeyError: 'node_name'`` from
        ``rest_framework/fields.py`` — a 500 on ``GET
        /api/v1/workflow/templates/{id}/``, the mirror image of the
        ``KeyError: 'name'`` the same split caused in ``create_from_judgment``.
        Both are held as regressions in ``tests/test_workflow_node_shape.py``.
      properties:
        id:
          type: string
        node_name:
          type: string
          maxLength: 255
        node_type:
          allOf:
          - $ref: '#/components/schemas/WorkflowTemplateNodeNodeTypeEnum'
          default: TRIAL
        court_code:
          type: string
          default: ''
          maxLength: 50
        approver_role:
          type: string
          default: ''
          maxLength: 20
        approver_type:
          allOf:
          - $ref: '#/components/schemas/WorkflowTemplateNodeApproverTypeEnum'
          default: ROLE
        node_order:
          type: integer
          default: 1
        on_pass:
          type: string
          nullable: true
        on_fail:
          type: string
          nullable: true
        position:
          type: object
          additionalProperties:
            type: number
            format: double
          nullable: true
      required:
      - node_name
    WorkflowTemplateNodeApproverTypeEnum:
      enum:
      - ACTOR
      - ROLE
      - SYSTEM
      type: string
      description: |-
        * `ACTOR` - ACTOR
        * `ROLE` - ROLE
        * `SYSTEM` - SYSTEM
    WorkflowTemplateNodeNodeTypeEnum:
      enum:
      - TRIAL
      - EVALUATION
      - APPEAL
      - FINAL
      - EXECUTION
      type: string
      description: |-
        * `TRIAL` - TRIAL
        * `EVALUATION` - EVALUATION
        * `APPEAL` - APPEAL
        * `FINAL` - FINAL
        * `EXECUTION` - EXECUTION
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: External-system API key, as `ApiKey <raw_key>`. The raw key is
        never stored — `ExternalApiKey.key_hash` holds its SHA-256.
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    soulJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
