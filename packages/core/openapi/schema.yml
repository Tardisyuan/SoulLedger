    Judgment:
      type: object
      description: |-
        A proceeding. Soul and judge are the requester's own (BD-01).

        `validate_soul` / `validate_judge` were declared on
        `JudgmentCitationSerializer` above, which has neither field, so DRF never
        called them and this class resolved bare primary keys. A cross-tenant
        hearing is `apps.dispatch.CrossTenantJudgment`; here both parties belong
        to the tenant that opened the case. ADMIN is exempt as everywhere else.

        `verdict`, `is_final`, `concluded_at` are read-only and an attempt to write
        them is an explicit 400 (BD-03) — a plain field write produced a "final"
        judgment with no Disposition and a soul still JUDGING, and `conclude/`
        then refused it as already concluded. `civilization` is read-only and
        derived from the soul (BD-08).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        soul:
          type: string
          format: uuid
        soul_name:
          type: string
          readOnly: true
        civilization:
          allOf:
          - $ref: '#/components/schemas/CivilizationEnum'
          readOnly: true
        judge:
          type: string
          format: uuid
          nullable: true
        judge_name:
          type: string
          readOnly: true
        court:
          type: string
          description: Court name, e.g. 第一殿
          maxLength: 255
        realm_id:
          type: string
          format: uuid
          nullable: true
        evidence_json: {}
        confession:
          type: string
        verdict:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/VerdictEnum'
          - $ref: '#/components/schemas/NullEnum'
        notes:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/JudgmentCitation'
          readOnly: true
        is_final:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        concluded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        kind:
          allOf:
          - $ref: '#/components/schemas/JudgmentKindEnum'
          readOnly: true
        amends_plan_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        draft_verdict:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/VerdictEnum'
          - $ref: '#/components/schemas/NullEnum'
        draft_saved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        draft_version:
          type: integer
          readOnly: true
      required:
      - amends_plan_id
      - citations
      - civilization
      - concluded_at
      - created_at
      - draft_saved_at
      - draft_verdict
      - draft_version
      - id
      - is_final
      - judge_name
      - kind
      - soul
      - soul_name
      - verdict
