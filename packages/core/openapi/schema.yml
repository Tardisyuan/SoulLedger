    get:
      operationId: v1_souls_list
      description: |-
        Soul CRUD + state transitions + record management.
        Tenant-isolated via TenantPermission + select_related for N+1 elimination.
      parameters:
      - in: query
        name: civilization
        schema:
          type: string
          enum:
          - CHINESE
          - EGYPTIAN
          - EUROPEAN
          - GREEK
        description: |-
          * `CHINESE` - Chinese Diyu
          * `EUROPEAN` - European Heaven/Hell
          * `EGYPTIAN` - Egyptian Duat
          * `GREEK` - Greek Underworld
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
