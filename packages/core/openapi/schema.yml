  /api/v1/recycle-bin/hard-delete/:
    post:
      operationId: v1_recycle_bin_hard_delete_create
      description: |-
        POST /api/v1/recycle-bin/hard-delete/  body: {"entity_type": "menu", "id": 3}

        Permanently removes a reference-data row past its 30-day retention
        window. Refuses (400, not a silent no-op) for anything else: a
        domain/judicial record, a type this bin doesn't know, a row that
        isn't actually deleted, or one still inside its window — the design
        doc's point that the bin should only ever contain things safe to
        destroy is enforced here, not just in the UI.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecycleBinHardDeleteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecycleBinHardDeleteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecycleBinHardDeleteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/recycle-bin/restore/:
    post:
      operationId: v1_recycle_bin_restore_create
      description: |-
        POST /api/v1/recycle-bin/restore/  body: {"cascade_id": "..."}

        Restores every row sharing that cascade id — the parent the user
        picked in the bin and every dependent cascaded alongside it at
        delete time. Not a per-row restore: the design doc is explicit that
        the bin must not let a user restore eight dependent rows
        independently of their parent.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecycleBinRestoreRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecycleBinRestoreRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecycleBinRestoreRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecycleBinRestoreResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/reincarnation/:
    get:
      operationId: v1_reincarnation_list
      description: |-
        Set the current-user contextvar around every write.

        A `contextvar` (`apps/core/request_local.py`), not thread-local — the
        distinction matters under ASGI, where one thread serves many requests.

        **This is the only place that sets it.** `AuditUserFields.save()` reads it
        to fill `create_user` / `update_user`, so a writable viewset that does not
        inherit this mixin records rows with no author — measured on eight of them
        2026-08-29, including `ExternalApiKeyViewSet` and `WebhookViewSet`, where
        "who added this" is the whole of the audit question.
        `tests/test_every_writable_audit_viewset_sets_the_user.py` walks the real
        URLconf so the next one to be added is caught rather than counted.
      parameters:
      - in: query
        name: cycle_count
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: rebirth_form
        schema:
          type: string
          enum:
          - ANIMAL
          - ASURA
          - DIVINE
          - HELL_BEING
          - HUMAN
          - HUNGRY_GHOST
          - OTHER
        description: |-
          * `DIVINE` - Deva (Heaven Path)
          * `HUMAN` - Human (Human Path)
          * `ASURA` - Asura (Demigod Path)
          * `ANIMAL` - Animal (Beast Path)
          * `HUNGRY_GHOST` - Hungry Ghost
          * `HELL_BEING` - Hell Being
          * `OTHER` - Other (Unclassified)
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: soul
        schema:
          type: string
          format: uuid
      tags:
      - v1
      security:
