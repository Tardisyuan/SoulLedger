    PermissionExport:
      type: object
      description: |-
        Body of GET /perm/export/ — served as a JSON file attachment.

        `version` is the export format's version string ("1.0"), unrelated to
        `Role.version`, which is the optimistic-lock counter.
      properties:
        version:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ExportedPermission'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ExportedRole'
        role_permissions:
          type: array
          items:
            $ref: '#/components/schemas/ExportedRolePermission'
        field_permissions:
          type: array
          items:
            $ref: '#/components/schemas/ExportedFieldPermission'
        data_scopes:
          type: array
          items:
            $ref: '#/components/schemas/ExportedDataScope'
      required:
      - data_scopes
      - field_permissions
      - permissions
      - role_permissions
      - roles
      - version
    PermissionImportRequest:
      type: object
      description: |-
        Body of POST /perm/import/ — an export document, plus `overwrite`.

        Every member is optional because `import_permissions` reads each one with
        `data.get(key, [])`: a document carrying only `roles` imports only roles.
        The view's own check is `if not data` — an empty body, nothing narrower.

        This is the serializer the view VALIDATES WITH, not just what it documents.
        Until 2026-09-12 it was never instantiated: `overwrite` came straight off
        `request.data`, so the string "false" was truthy and cleared every
        RolePermission with a 200, and a permission entry missing `name` was a
        KeyError 500 raised after the overwrite deletes had already run. See
        tests/test_perm_import_is_validated.py.
      properties:
        version:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ExportedPermission'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ExportedRole'
        role_permissions:
          type: array
          items:
            $ref: '#/components/schemas/ExportedRolePermission'
        field_permissions:
          type: array
          items:
            $ref: '#/components/schemas/ExportedFieldPermission'
        data_scopes:
          type: array
          items:
            $ref: '#/components/schemas/ExportedDataScope'
        overwrite:
          type: boolean
          default: false
    PermissionImportResult:
      type: object
      properties:
        message:
          type: string
        stats:
          $ref: '#/components/schemas/PermissionImportStats'
      required:
      - message
      - stats
    PermissionImportStats:
      type: object
      description: Rows CREATED per table — `get_or_create` misses are not counted.
      properties:
