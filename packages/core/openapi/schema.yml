    SoulRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        record_type:
          $ref: '#/components/schemas/RecordTypeEnum'
        category:
          allOf:
          - $ref: '#/components/schemas/SoulRecordCategoryEnum'
          description: |-
            Standardized category for this record

            * `CHARITY` - Charity / Generosity
            * `COMPASSION` - Compassion / Kindness
            * `HONESTY` - Honesty / Integrity
            * `COURAGE` - Courage / Bravery
            * `WISDOM` - Wisdom / Knowledge
            * `PIETY` - Piety / Devotion
            * `CRUELTY` - Cruelty / Violence
            * `DECEPTION` - Deception / Lying
            * `COWARDICE` - Cowardice
            * `GREED` - Greed / Avarice
            * `BLASPHEMY` - Blasphemy / Impiety
            * `MURDER` - Murder / Killing
            * `OTHER` - Other
        civilization:
          type: string
          readOnly: true
        description:
          type: string
        weight:
          type: integer
          maximum: 100
          minimum: 1
          description: Significance weight (1-100). Affects karma calculation.
        event_date:
          type: object
          nullable: true
          description: A possibly-BCE date. `year` is signed (negative = BCE); `month`
            and `day` are null when the source does not record them, which is common
            for ancient records. On write, `YYYY-MM-DD` and `-YYYY-MM-DD` strings
            are also accepted for backward compatibility; see `HistoricalDateField.to_internal_value`.
          properties:
            year:
              type: integer
            month:
              type: integer
              nullable: true
            day:
              type: integer
              nullable: true
          required:
          - year
          - month
          - day
        is_milestone:
          type: boolean
          description: Marks a turning point in the life. Display only — the lifecycle
            timeline stars and tints it. It does NOT change the deed's weight.
        evidence_json: {}
        recorded_at:
          type: string
          format: date-time
          readOnly: true
        date_problems:
          type: array
          items:
            $ref: '#/components/schemas/RecordDateProblem'
          readOnly: true
        statute_clause:
          type: string
          description: Which scoring clause this deed was scored under, as '<Statute.code>:<clause
            condition_zh>' — e.g. '救濟門#7:賑濟窮民百錢'. Blank means unknown, which makes
            this record granularity-blind.
          maxLength: 200
        occurrence_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: 'How many separate occasions this row''s weight covers. NOT
            a row count: one row may document a year of alms or three rows one killing.
            1 means 一次 — earned or incurred at a stroke. Null means unknown, which
            makes this record granularity-blind.'
        inferno_article:
          type: string
          description: Which Inferno article this deed belongs under, as a Statute
            code in the EU-INF-* corpus — e.g. 'EU-INF-C7-G1' (seventh circle, first
            girone) or 'EU-INF-C9-Z1' (Caina). Blank means unclassified, which leaves
            the European router on its culpa ladder for this deed.
          maxLength: 32
      required:
      - civilization
      - date_problems
      - description
      - id
      - record_type
      - recorded_at
