      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: current_state
        schema:
          type: string
          enum:
          - ALIVE
          - DISPOSED
          - JUDGING
          - LOST
          - REINCARNATING
          - SETTLED
        description: |-
          * `ALIVE` - Alive
          * `JUDGING` - Under Judgment
          * `DISPOSED` - Disposed
          * `REINCARNATING` - Reincarnating
          * `SETTLED` - Settled (Final)
          * `LOST` - Lost/Suspended
      - in: query
        name: death_date_after
        schema:
          type: string
          format: date
      - in: query
        name: death_date_before
        schema:
          type: string
          format: date
      - in: query
        name: has_date_problem
        schema:
          type: boolean
      - in: query
        name: karma_max
        schema:
          type: number
      - in: query
        name: karma_min
        schema:
          type: number
      - in: query
        name: karmic_balance_max
        schema:
          type: number
      - in: query
        name: karmic_balance_min
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
          enum:
          - ALIVE
          - DISPOSED
          - JUDGING
          - LOST
          - REINCARNATING
          - SETTLED
        description: |-
          * `ALIVE` - Alive
          * `JUDGING` - Under Judgment
          * `DISPOSED` - Disposed
          * `REINCARNATING` - Reincarnating
          * `SETTLED` - Settled (Final)
          * `LOST` - Lost/Suspended
      - in: query
        name: tenant__code
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSoulListList'
          description: ''
    post:
      operationId: v1_souls_create
      description: |-
        Soul CRUD + state transitions + record management.
        Tenant-isolated via TenantPermission + select_related for N+1 elimination.
      tags:
