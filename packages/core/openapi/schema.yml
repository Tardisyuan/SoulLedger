        * `PIETY` - Piety / Devotion
        * `CRUELTY` - Cruelty / Violence
        * `DECEPTION` - Deception / Lying
        * `COWARDICE` - Cowardice
        * `GREED` - Greed / Avarice
        * `BLASPHEMY` - Blasphemy / Impiety
        * `MURDER` - Murder / Killing
        * `OTHER` - Other
    SoulStateDistribution:
      type: object
      description: |-
        `label` is the raw state member today, same value as `state` — the
        view assigns `"label": s` beside `"state": s`. Localising is the
        client's job and this endpoint has no locale.
      properties:
        state:
          type: string
        label:
          type: string
