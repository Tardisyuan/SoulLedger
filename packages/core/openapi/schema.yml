        `{"error": "NOT_FOUND", "message": "Soul not found"}`.

        Two members, not one: `error` here is a machine code (NOT_FOUND,
        FORBIDDEN) and `message` is the prose. That is a different body from the
        `{"error": "<sentence>"}` the perm and auth views emit, which is why
        apps/core/schema.py's ErrorResponseSerializer is not reused — a client
        that printed this one's `error` would show the operator the word
        "NOT_FOUND".
      properties:
        error:
          type: string
        message:
          type: string
      required:
      - error
      - message
    LedgerInheritance:
      type: object
      description: |-
        200 body of `LedgerInheritanceView`.

        The two rates are the fractions the arithmetic above them used, not the
        20/100 percentages a card draws with. Shipping the same float makes it
        impossible for the displayed rate and the applied rate to disagree —
        which is a failure this codebase has already had once.
      properties:
        soul_id:
          type: string
          format: uuid
        inherited_merit:
          type: integer
        inherited_demerit:
          type: integer
        inheritance_merit_rate:
          type: number
          format: double
        inheritance_demerit_rate:
          type: number
          format: double
      required:
      - inheritance_demerit_rate
      - inheritance_merit_rate
      - inherited_demerit
      - inherited_merit
      - soul_id
    LedgerOverviewStats:
      type: object
      description: |-
        200 body of `LedgerOverviewStatsView`.

        `karma_distribution_total` is emitted rather than assumed: it always
        equals `total_souls` because the buckets partition the whole line, and
        it exists so a reader can check that without re-deriving the bounds.
      properties:
        total_souls:
          type: integer
        state_distribution:
          type: array
          items:
            $ref: '#/components/schemas/SoulStateDistribution'
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantSoulStats'
        karma_distribution:
          type: array
          items:
            $ref: '#/components/schemas/KarmaBucket'
        karma_distribution_total:
          type: integer
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/RecentActivity'
        souls_by_realm:
          type: array
          items:
            $ref: '#/components/schemas/SoulsByRealm'
      required:
      - karma_distribution
      - karma_distribution_total
      - recent_activity
      - souls_by_realm
      - state_distribution
      - tenants
      - total_souls
    LedgerReading:
      oneOf:
      - $ref: '#/components/schemas/BalanceReading'
      - $ref: '#/components/schemas/ThresholdReading'
      - $ref: '#/components/schemas/GuiltAndPenaltyReading'
      - $ref: '#/components/schemas/SentenceReading'
      - $ref: '#/components/schemas/UnavailableReading'
      discriminator:
        propertyName: kind
        mapping:
          BALANCE: '#/components/schemas/BalanceReading'
          THRESHOLD: '#/components/schemas/ThresholdReading'
          GUILT_AND_PENALTY: '#/components/schemas/GuiltAndPenaltyReading'
          SENTENCE: '#/components/schemas/SentenceReading'
          UNAVAILABLE: '#/components/schemas/UnavailableReading'
    LedgerRecalculateResult:
      type: object
      description: |-
        200 body of `LedgerRecalculateView` — the denormalised columns as
        they stand after the write, not the decayed sums that produced them.
      properties:
        soul_id:
          type: string
          format: uuid
        merit_score:
          type: integer
        demerit_score:
          type: integer
        karmic_balance:
          type: integer
      required:
      - demerit_score
      - karmic_balance
      - merit_score
      - soul_id
    LedgerRecordEventDate:
      type: object
      description: |-
        `{year, month, day}` — never an ISO string. `year` can be negative
        (BCE) and month/day are routinely unknown for ancient records, which is
        the whole reason this is structured. See apps.souls.dates.
      properties:
        year:
          type: integer
        month:
          type: integer
          nullable: true
        day:
          type: integer
          nullable: true
      required:
      - day
      - month
      - year
    LedgerRecordSummary:
      type: object
