          description: 第一殿, Hall of Two Truths, etc.
          maxLength: 50
        realm:
          type: string
          format: uuid
          nullable: true
        required_verdicts:
          description: 可接受的裁决列表，如 ['PASSED', 'FAILED', 'RETRY']
        status:
          allOf:
          - $ref: '#/components/schemas/ApprovalNodeStatusEnum'
          readOnly: true
        verdict:
          type: string
          readOnly: true
        evidence_json: {}
        notes:
          type: string
        approver:
          type: integer
          readOnly: true
          nullable: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
