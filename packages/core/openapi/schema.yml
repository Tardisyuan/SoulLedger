    Soul:
      type: object
      description: |-
        Soul detail. Field access is enforced in two layers, deliberately.

        The hardcoded VIEWER checks below are the floor. FieldPermissionMixin
        reads FieldPermission rows and can only narrow further — it never widens,
        because a DB-driven rule that is the *only* guard fails open: the rules
        live in a management command, and an unseeded database would hand VIEWER
        every field. The floor holds with an empty table.

        The two used to disagree. seed_field_permissions declared VIEWER's
        merit_score and demerit_score `visible=True, read_only=True`, while this
        serializer has always removed them from the payload outright, and
        read_only_fields already made them unwritable for every role — so both
        halves of the seeded rule were inert and the looser text never described
        what shipped. The seed now says visible=False, which is what the code
        does. Widening VIEWER back to seeing scores is a security decision and
        needs to be made deliberately, not inherited from a stale fixture.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        current_state:
          allOf:
          - $ref: '#/components/schemas/CurrentStateEnum'
          readOnly: true
        tenant_code:
          type: string
          readOnly: true
        tenant:
          type: integer
          readOnly: true
        civilization:
          type: string
          readOnly: true
        home_tenant:
          allOf:
          - $ref: '#/components/schemas/SoulHomeTenant'
          readOnly: true
        home_civilization:
          type: string
          readOnly: true
        is_residing:
          type: boolean
          readOnly: true
        birth_date:
          type: object
          nullable: true
          description: A possibly-BCE date. `year` is signed (negative = BCE); `month`
            and `day` are null when the source does not record them, which is common
            for ancient records. On write, `YYYY-MM-DD` and `-YYYY-MM-DD` strings
            are also accepted for backward compatibility; see `HistoricalDateField.to_internal_value`.
          properties:
            year:
              type: integer
            month:
              type: integer
              nullable: true
            day:
              type: integer
              nullable: true
          required:
          - year
          - month
          - day
        death_date:
          type: object
          nullable: true
          description: A possibly-BCE date. `year` is signed (negative = BCE); `month`
            and `day` are null when the source does not record them, which is common
            for ancient records. On write, `YYYY-MM-DD` and `-YYYY-MM-DD` strings
            are also accepted for backward compatibility; see `HistoricalDateField.to_internal_value`.
          properties:
            year:
              type: integer
            month:
              type: integer
              nullable: true
            day:
              type: integer
              nullable: true
          required:
          - year
          - month
          - day
        origin_location:
          type: string
          maxLength: 255
        birth_name:
          type: string
          maxLength: 255
        description:
          type: string
        merit_score:
          type: integer
          nullable: true
          readOnly: true
        demerit_score:
          type: integer
          nullable: true
          readOnly: true
        karmic_balance:
          type: integer
          readOnly: true
        create_time:
          type: string
          format: date-time
          readOnly: true
        update_time:
          type: string
          format: date-time
          readOnly: true
        records:
          type: array
          items:
            $ref: '#/components/schemas/SoulRecord'
          readOnly: true
        date_problems:
          type: array
          items:
            $ref: '#/components/schemas/SoulDateProblem'
          readOnly: true
        life_index:
          type: integer
          readOnly: true
        inherited_merit:
          type: integer
          readOnly: true
        inherited_demerit:
          type: integer
          readOnly: true
      required:
      - civilization
      - create_time
      - current_state
      - date_problems
      - demerit_score
      - home_civilization
      - home_tenant
      - id
      - inherited_demerit
      - inherited_merit
      - is_residing
      - karmic_balance
      - life_index
      - merit_score
      - name
      - records
      - tenant
      - tenant_code
      - update_time
