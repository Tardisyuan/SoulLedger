        realm_code:
          type: string
          nullable: true
          readOnly: true
        realm_name:
          type: string
          nullable: true
          readOnly: true
        same_court:
          type: boolean
          readOnly: true
        shared_statutes:
          type: integer
          readOnly: true
      required:
      - balance
      - concluded_at
      - court
      - id
      - name
      - realm_code
      - realm_name
      - same_court
      - shared_statutes
      - soul
      - verdict
    JudgmentQueueCursor:
      type: object
      description: |-
        The envelope `GET /api/v1/judgment/next/` returns.

        Schema-only, never instantiated. This is the response a judgment client
        hits most, and until this class existed it was documented as a bare
        `Judgment` — drf-spectacular's fallback to the viewset serializer, which is
        silent and was wrong. A generated client typed against that would have
        reached for `verdict` on an object whose top level is a cursor.

        Every field below is nullable or empty when the queue is exhausted: the
        view builds the payload with `judgment`/`soul`/`ledger` at `None` and the
        two lists empty, then fills them only once it has a case (see
        `JudgmentViewSet.next_pending`). `position` is additionally null when
        `remaining` is 0, because "the Nth of M" has no N when there is nothing
        left to rule on.

        The cross-app imports here are the same ones `views.py` already makes to
        build this payload; they are not a new dependency, and keeping the shape
        beside the other judgment serializers is what makes it possible to check
        that it still matches.
      properties:
        total:
          type: integer
        remaining:
          type: integer
        skipped:
          type: integer
        position:
          type: integer
          nullable: true
        judgment:
          allOf:
          - $ref: '#/components/schemas/Judgment'
          nullable: true
        soul:
          allOf:
          - $ref: '#/components/schemas/Soul'
          nullable: true
        ledger:
          allOf:
          - $ref: '#/components/schemas/LedgerSummary'
          nullable: true
        prior_cycles:
          type: array
          items:
            $ref: '#/components/schemas/Reincarnation'
        realm_options:
          type: array
          items:
            $ref: '#/components/schemas/RealmLocalized'
      required:
      - judgment
      - ledger
      - position
      - prior_cycles
      - realm_options
      - remaining
      - skipped
      - soul
      - total
    KarmaBucket:
      type: object
      description: |-
        Only label and count reach the wire — the `min`/`max` bounds the view
        computes with are not emitted. The end buckets are unbounded, so the
        counts always sum to `total_souls`.
      properties:
        label:
          type: string
        count:
          type: integer
      required:
      - count
      - label
    KindEnum:
      enum:
      - reference
      - domain
      type: string
      description: |-
        * `reference` - reference
        * `domain` - domain
    LedgerEffective:
      type: object
      description: |-
        200 body of `LedgerEffectiveView`. Same three numbers as the summary's
        merit/demerit/balance, under names that say they are decay-applied.
      properties:
        soul_id:
          type: string
          format: uuid
        effective_merit:
          type: integer
        effective_demerit:
          type: integer
        effective_balance:
          type: integer
      required:
      - effective_balance
      - effective_demerit
      - effective_merit
      - soul_id
    LedgerError:
      type: object
      description: |-
        `{"error": "NOT_FOUND", "message": "Soul not found"}`.

        Two members, not one: `error` here is a machine code (NOT_FOUND,
        FORBIDDEN) and `message` is the prose. That is a different body from the
        `{"error": "<sentence>"}` the perm and auth views emit, which is why
        apps/core/schema.py's ErrorResponseSerializer is not reused — a client
        that printed this one's `error` would show the operator the word
        "NOT_FOUND".
      properties:
        error:
          type: string
        message:
          type: string
      required:
      - error
      - message
    LedgerInheritance:
      type: object
      description: |-
        200 body of `LedgerInheritanceView`.

        The two rates are the fractions the arithmetic above them used, not the
        20/100 percentages a card draws with. Shipping the same float makes it
        impossible for the displayed rate and the applied rate to disagree —
        which is a failure this codebase has already had once.
      properties:
        soul_id:
          type: string
          format: uuid
        inherited_merit:
          type: integer
        inherited_demerit:
          type: integer
        inheritance_merit_rate:
          type: number
          format: double
        inheritance_demerit_rate:
          type: number
          format: double
      required:
      - inheritance_demerit_rate
      - inheritance_merit_rate
      - inherited_demerit
      - inherited_merit
      - soul_id
    LedgerOverviewStats:
      type: object
      description: |-
        200 body of `LedgerOverviewStatsView`.

        `karma_distribution_total` is emitted rather than assumed: it always
        equals `total_souls` because the buckets partition the whole line, and
        it exists so a reader can check that without re-deriving the bounds.
      properties:
        total_souls:
          type: integer
        state_distribution:
          type: array
          items:
            $ref: '#/components/schemas/SoulStateDistribution'
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantSoulStats'
        karma_distribution:
          type: array
          items:
            $ref: '#/components/schemas/KarmaBucket'
        karma_distribution_total:
          type: integer
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/RecentActivity'
        souls_by_realm:
          type: array
          items:
            $ref: '#/components/schemas/SoulsByRealm'
      required:
      - karma_distribution
      - karma_distribution_total
      - recent_activity
      - souls_by_realm
      - state_distribution
      - tenants
      - total_souls
    LedgerReading:
      oneOf:
      - $ref: '#/components/schemas/BalanceReading'
      - $ref: '#/components/schemas/ThresholdReading'
      - $ref: '#/components/schemas/GuiltAndPenaltyReading'
      - $ref: '#/components/schemas/SentenceReading'
      - $ref: '#/components/schemas/UnavailableReading'
      discriminator:
        propertyName: kind
