  /api/v1/judgment/next/:
    get:
      operationId: v1_judgment_next_retrieve
      description: |-
        The next case to rule on, with everything needed to rule on it.

        `GET /api/v1/judgment/next/?skip=<id>&skip=<id>,<id>`

        BRIEF §4.2 decided a queue/triage mode over multi-select: each verdict
        is a judgement call, so the cost to remove is the cost of moving
        *between* items. The paginated list this app already had cannot do
        that — it answers "which judgments exist", not "what do I decide next
        and what do I need in front of me to decide it". Hence one response
        carrying the whole decision surface instead of the five round-trips
        (judgment, soul, ledger, prior cycles, realms) the detail page makes:

          judgment      — the proceeding itself (JudgmentSerializer)
          soul          — identity, dates, state, karmic_balance (SoulSerializer)
          ledger        — the merit/demerit reading, decayed, from
                          LedgerService.get_ledger_summary — the same body
                          /souls/{id}/karma/ returns
          prior_cycles  — previous reincarnations, newest first
          realm_options — the realms this soul's civilization can send it to

        Every one of those is an existing serializer/service called as-is;
        nothing here re-implements a read that already exists elsewhere.

        Progress. `total` is how many cases are pending in scope right now,
        `remaining` how many of those the caller has not skipped, and
        `position` = total - remaining + 1, i.e. "the Nth of M". These are
        counts of live rows, so `total` falls by one each time a verdict lands
        — the client should latch the first `total` it sees if it wants a
        denominator that stays put for the sitting.

        An empty queue is a 200 with `judgment: null`, not a 404. "You are
        done" is a successful, renderable answer and the counts still matter
        (they say whether the queue was empty or merely skipped dry); a 404
        would drive the client's error boundary instead.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Judgment'
          description: ''
  /api/v1/judgment/statutes/:
    get:
      operationId: v1_judgment_statutes_list
      description: |-
        The articles a verdict can be founded on — read-only reference data.

        Read-only on purpose. These rows are seeded from documents whose provenance
        is recorded on every row (`source`, `source_notes`); an API that let an
        operator type a new "冥律 article" would produce exactly the fabricated
        statutes this feature was specified not to have. Corrections go through
        `manage.py seed_mythology --update`, next to the text they came from.

        `permission_codename = "judgment"` rather than a new `statute.*` family:
        reading the rulebook is part of reading a case, the codename is already
        defined and granted, and inventing `statute.read` would seed an orphan no
        role holds (apps/perm/test_codename_coverage.py catches exactly that).
      parameters:
      - in: query
        name: civilization
        schema:
          type: string
          enum:
          - CHINESE
          - EGYPTIAN
          - EUROPEAN
          - GREEK
        description: |-
          * `CHINESE` - Chinese Diyu
          * `EUROPEAN` - European Heaven/Hell
          * `EGYPTIAN` - Egyptian Duat
          * `GREEK` - Greek Underworld
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: corpus
        schema:
          type: string
          enum:
          - DEADLY_SIN
          - GONGGUOGE
          - GORGIAS
          - HELL_LAW
          - INFERNO
          - NEGATIVE_CONFESSION
          - REPUBLIC_ER
        description: |-
          * `HELL_LAW` - 冥律 — Hell Law (Chinese)
          * `GONGGUOGE` - 功過格 — Ledger of Merit and Demerit (Chinese)
          * `NEGATIVE_CONFESSION` - Declaration of Innocence (Egyptian)
          * `DEADLY_SIN` - Seven Deadly Sins (European)
          * `INFERNO` - Inferno — the Circles of Dante's Hell (European)
          * `GORGIAS` - Gorgias — the Judgement of the Dead (Greek)
          * `REPUBLIC_ER` - Republic X — the Myth of Er (Greek)
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: polarity
        schema:
          type: string
          enum:
          - DENIAL
          - MERIT
          - OFFENCE
          - PROCEDURE
        description: |-
          * `OFFENCE` - Offence — counts against the soul
          * `MERIT` - Merit — counts for the soul
          * `DENIAL` - Denial the deceased must sustain
          * `PROCEDURE` - Rule of the court — neither for nor against
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStatuteList'
          description: ''
  /api/v1/judgment/statutes/{id}/:
    get:
      operationId: v1_judgment_statutes_retrieve
      description: |-
        The articles a verdict can be founded on — read-only reference data.

        Read-only on purpose. These rows are seeded from documents whose provenance
        is recorded on every row (`source`, `source_notes`); an API that let an
        operator type a new "冥律 article" would produce exactly the fabricated
        statutes this feature was specified not to have. Corrections go through
        `manage.py seed_mythology --update`, next to the text they came from.

        `permission_codename = "judgment"` rather than a new `statute.*` family:
        reading the rulebook is part of reading a case, the codename is already
        defined and granted, and inventing `statute.read` would seed an orphan no
        role holds (apps/perm/test_codename_coverage.py catches exactly that).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Statute.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statute'
          description: ''
  /api/v1/ledger/balance/{soul_id}/:
    get:
      operationId: v1_ledger_balance_retrieve
      description: |-
        GET /ledger/balance/{soul_id}/

        Returns the ledger summary with time-decay for a soul. Cached 5min.
        Tenant-isolated via TenantManager.

        The body carries both `karmic_balance` (merit minus demerit, which is the
        Chinese instrument and is what the rest of the system routes on) and
        `reading` — the instrument this soul's own cosmology uses. Clients that
        show a user a number should show `reading`; see apps/ledger/readings.py.

        Decay is per-civilization: EUROPEAN deeds do not decay at all, because the
        published European heading promises reduction by contrition and act rather
        than by elapsed time. See CIVILIZATION_DECAY_RATE.
      parameters:
      - in: path
        name: soul_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerSummary'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerError'
          description: ''
  /api/v1/ledger/calculate/{soul_id}/:
    post:
      operationId: v1_ledger_calculate_create
      description: |-
        POST /ledger/calculate/{soul_id}/

        Recalculates and persists ledger scores for a soul. Tenant-isolated.
      parameters:
