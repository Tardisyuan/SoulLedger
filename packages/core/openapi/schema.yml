    User:
      type: object
      description: |-
        The serializer behind `PATCH /auth/profile/` — what a user may change
        about themselves.

        `role` and `tenant` were already locked. `organization` was not, and it is
        a foreign key with no tenant check: measured, a VIEWER could
        `PATCH /auth/profile/ {"organization": <an org belonging to tenant B>}`
        and get 200. Nothing downstream widened that into data access
        (`apps/perm/filters.py` never mentions `organization`, so `DataScopeFilter`
        does not read it), which is why this is a write-integrity hole rather than
        a privilege escalation — but "the field nobody reads today" is not a
        permission model.

        Kept writable rather than made read-only: moving between the organizations
        of one's own tenant is what this field is for. The scoping happens in
        `validate_organization`.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        display_name:
          type: string
          description: Display name shown in the navbar (e.g. 系统管理员)
          maxLength: 100
        organization:
          type: integer
          nullable: true
          description: 所属组织：如 第一殿、冥王厅
        position:
          type: string
          description: 职位：如 第一殿殿主
          maxLength: 100
      required:
      - id
      - is_active
      - role
      - username
    UserCreate:
      type: object
      description: |-
        User serializer for creation with password handling.

        Non-ADMIN callers are constrained two ways (see ROLE_HIERARCHY above):
        - `tenant` is forced to the caller's own tenant — a client-supplied
          value for another tenant is rejected rather than silently honored.
        - `role` can never be more privileged than the caller's own role, which
          is what blocks a non-ADMIN from creating an ADMIN account (themselves
          or anyone else).
        ADMIN keeps its existing unrestricted behavior (any tenant, any role).
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        tenant:
          type: integer
          nullable: true
        organization:
          type: integer
          nullable: true
          description: 所属组织：如 第一殿、冥王厅
        position:
          type: string
          description: 职位：如 第一殿殿主
          maxLength: 100
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
      required:
      - id
      - password
      - username
    UserManagement:
      type: object
      description: User serializer for list/retrieve operations in user management
        API.
      properties:
        id:
          type: integer
          readOnly: true
        username:
