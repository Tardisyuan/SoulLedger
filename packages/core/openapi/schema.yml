    LoginResponse:
      type: object
      description: |-
        Doc-only: the 200 body of `LoginView` — simplejwt's `access`/`refresh`
        plus the `user` that `CustomTokenObtainPairSerializer.validate` adds.

        The view inherits `serializer_class = CustomTokenObtainPairSerializer`, so
