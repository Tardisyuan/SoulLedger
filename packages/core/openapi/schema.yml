      enum:
      - MERIT
      - DEMERIT
      - JUDGMENT
      - DISPOSITION
      type: string
      description: |-
        * `MERIT` - Merit
        * `DEMERIT` - Demerit
        * `JUDGMENT` - Judgment Evidence
        * `DISPOSITION` - Disposition Record
    RecycleBinEntry:
      type: object
      description: |-
        One row of the bin — always a cascade PARENT, never a dependent.

        Built by `recycle_bin.list_bin_entries`. `dependent_count` is how many
        other rows share this row's cascade id, which is what "含 N 项关联" shows;
        the dependents themselves are deliberately not listed as entries.

        `retention_days` and `hard_delete_eligible` are meaningful only for
        `kind == "reference"`. A domain record (a judicial-process row) gets
        `retention_days: null` and `hard_delete_eligible: false` permanently —
        it has no hard-delete path here at all, not one that has yet to open.
      properties:
        entity_type:
          type: string
        kind:
          $ref: '#/components/schemas/KindEnum'
        id:
          oneOf:
          - type: integer
          - type: string
            format: uuid
        label:
          type: string
        deleted_at:
          type: string
          format: date-time
          nullable: true
        deleted_by:
          type: string
          nullable: true
        delete_reason:
          type: string
        cascade_id:
          type: string
          format: uuid
          nullable: true
        dependent_count:
          type: integer
        retention_days:
          type: integer
          nullable: true
        hard_delete_eligible:
          type: boolean
      required:
      - cascade_id
      - delete_reason
      - deleted_at
      - deleted_by
      - dependent_count
      - entity_type
      - hard_delete_eligible
      - id
      - kind
      - label
      - retention_days
    RecycleBinHardDeleteRequest:
      type: object
      description: |-
        `entity_type` must name a *reference* type; a domain record is
        refused with 400 rather than silently ignored.
      properties:
        entity_type:
          type: string
        id:
          oneOf:
          - type: integer
          - type: string
            format: uuid
      required:
      - entity_type
      - id
    RecycleBinList:
      type: object
      description: |-
        `count` is the length of `results`, not a paginated total — this
        endpoint is unpaginated and returns the whole bin.

        `many=False` because drf-spectacular treats any response on a ViewSet's
        `list` action as a list and wrapped this envelope in an array: the schema
        said `[{results, count}]` while `list()` returns one `{results, count}`
        (measured 2026-09-14 over the test client).
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecycleBinEntry'
        count:
          type: integer
      required:
      - count
      - results
    RecycleBinRestoreRequest:
      type: object
      description: |-
        Restore is keyed by cascade id, not by row: the whole set deleted
        together comes back together.
      properties:
        cascade_id:
          type: string
          format: uuid
      required:
      - cascade_id
    RecycleBinRestoreResult:
      type: object
      description: Rows actually restored, across every model sharing the cascade
        id.
      properties:
        restored:
          type: integer
      required:
      - restored
