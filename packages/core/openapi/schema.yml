          * `PENDING` - 待审批
          * `IN_PROGRESS` - 审批中
          * `APPROVED` - 已批准
          * `REJECTED` - 已拒绝
          * `APPEAL` - 申诉中
          * `EXCEPTION` - 异常处理
          * `COMPLETED` - 流程完成
