        An AuditLog row flattened. `user` is the username or the literal
        string "System" for a row with no user — not null.
      properties:
        id:
          type: integer
        action:
          type: string
        resource:
          type: string
        resource_id:
          type: string
        description:
          type: string
        user:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
      - action
      - description
      - id
      - resource
      - resource_id
      - timestamp
      - user
    RecordDateProblem:
      type: object
      description: |-
        The record-level shape: the soul-level three plus the acknowledged trio.

        The trio is absent from `SoulDateProblemSerializer` on purpose and the
        reason is recorded at `_soul_level_date_problems`: both soul-level codes are
        ERROR severity, and an ERROR is refused at write time, so there is never a
        persisted soul-level problem to acknowledge.
      properties:
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        code:
          type: string
        message:
          type: string
        acknowledged:
          type: boolean
        acknowledged_by:
          type: string
          nullable: true
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
      required:
      - acknowledged
      - acknowledged_at
      - acknowledged_by
      - code
      - message
      - severity
    RecordTypeEnum:
      enum:
      - MERIT
      - DEMERIT
      - JUDGMENT
      - DISPOSITION
      type: string
      description: |-
        * `MERIT` - Merit
        * `DEMERIT` - Demerit
        * `JUDGMENT` - Judgment Evidence
        * `DISPOSITION` - Disposition Record
    RecycleBinEntry:
      type: object
      description: |-
        One row of the bin — always a cascade PARENT, never a dependent.

        Built by `recycle_bin.list_bin_entries`. `dependent_count` is how many
        other rows share this row's cascade id, which is what "含 N 项关联" shows;
        the dependents themselves are deliberately not listed as entries.

        `retention_days` and `hard_delete_eligible` are meaningful only for
        `kind == "reference"`. A domain record (a judicial-process row) gets
        `retention_days: null` and `hard_delete_eligible: false` permanently —
        it has no hard-delete path here at all, not one that has yet to open.
      properties:
        entity_type:
          type: string
        kind:
          $ref: '#/components/schemas/KindEnum'
        id:
          oneOf:
          - type: integer
          - type: string
            format: uuid
        label:
          type: string
        deleted_at:
          type: string
          format: date-time
          nullable: true
        deleted_by:
          type: string
          nullable: true
        delete_reason:
          type: string
        cascade_id:
          type: string
          format: uuid
          nullable: true
        dependent_count:
          type: integer
        retention_days:
          type: integer
          nullable: true
        hard_delete_eligible:
          type: boolean
      required:
      - cascade_id
      - delete_reason
      - deleted_at
      - deleted_by
      - dependent_count
      - entity_type
      - hard_delete_eligible
      - id
      - kind
      - label
      - retention_days
    RecycleBinHardDeleteRequest:
      type: object
      description: |-
        `entity_type` must name a *reference* type; a domain record is
        refused with 400 rather than silently ignored.
      properties:
        entity_type:
          type: string
        id:
          oneOf:
          - type: integer
          - type: string
            format: uuid
      required:
      - entity_type
      - id
    RecycleBinList:
      type: object
      description: |-
        `count` is the length of `results`, not a paginated total — this
        endpoint is unpaginated and returns the whole bin.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecycleBinEntry'
        count:
          type: integer
      required:
      - count
      - results
    RecycleBinRestoreRequest:
      type: object
      description: |-
