          type: integer
      required:
      - count
      - label
      - state
    SoulsByRealm:
      type: object
      description: Executed, non-archived dispositions with a destination realm.
      properties:
        realm_code:
          type: string
        realm_name:
          type: string
        civilization:
          type: string
        count:
          type: integer
      required:
      - civilization
      - count
      - realm_code
      - realm_name
    Statute:
      type: object
      description: |-
        One citable article.

        `display_text` is where a *derived* article becomes readable: for the
        Egyptian 42 the body lives on `Actor.powers_json["negative_confession"]`
        and this is the field that reads it. `text_en` on those rows is empty and
        stays empty — see Statute's docstring on why there is no second copy.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          description: Stable citation key, e.g. CN-GGG-F-JJ-01 / EG-NC-07 / EU-DS-T3
            / EU-INF-C8-B02. CN-HL-* and EU-DS-01..07 are withdrawn keys and are not
            reused.
          maxLength: 40
        civilization:
          $ref: '#/components/schemas/CivilizationEnum'
        corpus:
          $ref: '#/components/schemas/CorpusEnum'
        ordinal:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        polarity:
          $ref: '#/components/schemas/PolarityEnum'
        title_zh:
          type: string
          maxLength: 255
        title_en:
          type: string
          maxLength: 255
        title_egy:
          type: string
          maxLength: 255
        text_zh:
          type: string
        text_en:
          type: string
        text_egy:
          type: string
        display_title:
          type: string
          readOnly: true
        display_text:
          type: string
          readOnly: true
        is_derived:
          type: boolean
          readOnly: true
        citation_count:
          type: integer
          nullable: true
          description: |-
            How many times this tenant has cited the article — or ``None``.

            A method field rather than ``IntegerField`` because the annotation is
            only present on one of this serializer's two paths.
            ``StatuteViewSet.get_queryset`` adds it; the nested use at
            ``JudgmentCitationSerializer.statute`` reaches the row through the FK,
            where no annotation exists and a declared ``IntegerField`` would raise
            ``AttributeError`` on every citation read.

            ``None``, not ``0``. "Nobody has cited this" and "this response does
            not carry the count" are different facts, and collapsing them puts a
            confident zero next to an article that may be the most-cited one in the
            corpus. The frontend renders the absent case through ``MissingValue``
            for the same reason.
          readOnly: true
        source:
          type: string
        source_notes: {}
        payload_json: {}
      required:
      - citation_count
      - civilization
      - code
      - corpus
      - display_text
      - display_title
      - id
      - is_derived
    SystemTypeEnum:
      enum:
