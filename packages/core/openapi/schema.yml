openapi: 3.0.3
info:
  title: SoulLedger API
  version: 0.1.0
  description: Cross-civilization soul management system API
paths:
  /api/v1/actors/:
    get:
      operationId: v1_actors_list
      description: |-
        Read-only actor listing and detail.
        Use '?localized=true' query param to get display_name resolved by Accept-Language.
      parameters:
      - in: query
        name: civilization
        schema:
          type: string
          enum:
          - CHINESE
          - EGYPTIAN
          - EUROPEAN
          - GREEK
        description: |-
          * `CHINESE` - Chinese Diyu
          * `EUROPEAN` - European Heaven/Hell
          * `EGYPTIAN` - Egyptian Duat
          * `GREEK` - Greek Underworld
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: realm
        schema:
          type: string
      - in: query
        name: role
        schema:
          type: string
          enum:
          - CONDUIT
          - EXECUTOR
          - GUARDIAN
          - JUDGE
          - OVERSEER
        description: |-
          * `JUDGE` - Judge
          * `EXECUTOR` - Executor / Punisher
          * `GUARDIAN` - Guardian
          * `CONDUIT` - Soul Conduit / Guide
          * `OVERSEER` - Overseer / Admin
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActorListList'
          description: ''
  /api/v1/actors/{id}/:
    get:
      operationId: v1_actors_retrieve
      description: |-
        Read-only actor listing and detail.
        Use '?localized=true' query param to get display_name resolved by Accept-Language.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Actor.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
          description: ''
  /api/v1/audit-logs/:
    get:
      operationId: v1_audit_logs_list
      description: |-
        AuditLog ViewSet with filtering support.

        Supports filtering by:
        - user: User ID who performed the action
        - action: Action type (CREATE, UPDATE, DELETE, etc.)
        - resource: Resource type (soul, judgment, karma, etc.)
        - resource_id: Specific resource ID
        - start_date/end_date: Time range filter

        Example:
            GET /api/v1/audit-logs/?user=1&action=CREATE&resource=soul
            GET /api/v1/audit-logs/?start_date=2024-01-01&end_date=2024-12-31
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - BATCH_CREATE
          - BATCH_DELETE
          - BATCH_UPDATE
          - CREATE
          - DELETE
          - EXECUTE
          - EXPORT
          - IMPORT
          - LOGIN
          - LOGOUT
          - PERMISSION_CHANGE
          - READ
          - UPDATE
          - VIEW
        description: |-
          * `CREATE` - 创建
          * `UPDATE` - 更新
          * `DELETE` - 删除
          * `EXECUTE` - 执行
          * `READ` - 读取
          * `LOGIN` - 登录
          * `LOGOUT` - 登出
          * `VIEW` - 查看
          * `EXPORT` - 导出
          * `IMPORT` - 导入
          * `PERMISSION_CHANGE` - 权限变更
          * `BATCH_CREATE` - 批量创建
          * `BATCH_UPDATE` - 批量更新
          * `BATCH_DELETE` - 批量删除
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: resource
        schema:
          type: string
      - in: query
        name: resource_id
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit-logs/{id}/:
    get:
      operationId: v1_audit_logs_retrieve
      description: |-
        AuditLog ViewSet with filtering support.

        Supports filtering by:
        - user: User ID who performed the action
        - action: Action type (CREATE, UPDATE, DELETE, etc.)
        - resource: Resource type (soul, judgment, karma, etc.)
        - resource_id: Specific resource ID
        - start_date/end_date: Time range filter

        Example:
            GET /api/v1/audit-logs/?user=1&action=CREATE&resource=soul
            GET /api/v1/audit-logs/?start_date=2024-01-01&end_date=2024-12-31
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Audit Log.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogDetail'
          description: ''
  /api/v1/audit-logs/actions/:
    get:
      operationId: v1_audit_logs_actions_retrieve
      description: |-
        GET /api/v1/audit-logs/actions/
        Returns all available action types.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/audit-logs/resources/:
    get:
      operationId: v1_audit_logs_resources_retrieve
      description: |-
        GET /api/v1/audit-logs/resources/
