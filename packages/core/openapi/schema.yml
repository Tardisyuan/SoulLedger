  /api/v1/death-sync/register/:
    get:
      operationId: v1_death_sync_register_list
      description: |-
        Death registration endpoints (API key authenticated). Create and read only.

        `DeathRegistrationRequest`'s docstring says "Immutable after creation.
        Used for idempotency, audit, and retry" — and this was a `ModelViewSet`,
        so an external system could `DELETE .../register/{id}/` and get 204.
        Measured 2026-08-29: the row then disappeared from `objects` and stayed in
        `_base_manager` (soft delete), i.e. **a registration could be removed from
        the audit trail by the same key that created it.**

        Create + read, so PUT/PATCH/DELETE answer 405 instead. The retry path that
        docstring mentions goes through the service, not through the client
        editing its own record.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeathRegistrationRequestList'
          description: ''
    post:
      operationId: v1_death_sync_register_create
      description: Register a death (single or batch).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeathRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeathRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeathRegistrationRequest'
      security:
      - ApiKeyAuth: []
      responses:
