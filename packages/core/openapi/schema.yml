openapi: 3.0.3
info:
  title: SoulLedger API
  version: 0.1.0
  description: Cross-civilization soul management system API
paths:
  /api/v1/actors/:
    get:
      operationId: v1_actors_list
      description: |-
        Read-only actor listing and detail.
        Use '?localized=true' query param to get display_name resolved by Accept-Language.
      parameters:
      - in: query
        name: civilization
        schema:
          type: string
          enum:
          - CHINESE
          - EGYPTIAN
          - EUROPEAN
          - GREEK
        description: |-
          * `CHINESE` - Chinese Diyu
          * `EUROPEAN` - European Heaven/Hell
          * `EGYPTIAN` - Egyptian Duat
          * `GREEK` - Greek Underworld
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: realm
        schema:
          type: string
      - in: query
        name: role
        schema:
          type: string
          enum:
          - CONDUIT
          - EXECUTOR
          - GUARDIAN
          - JUDGE
          - OVERSEER
        description: |-
          * `JUDGE` - Judge
          * `EXECUTOR` - Executor / Punisher
          * `GUARDIAN` - Guardian
          * `CONDUIT` - Soul Conduit / Guide
          * `OVERSEER` - Overseer / Admin
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActorListList'
          description: ''
  /api/v1/actors/{id}/:
    get:
      operationId: v1_actors_retrieve
      description: |-
        Read-only actor listing and detail.
        Use '?localized=true' query param to get display_name resolved by Accept-Language.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Actor.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
          description: ''
  /api/v1/audit-logs/:
    get:
      operationId: v1_audit_logs_list
      description: |-
        AuditLog ViewSet with filtering support.

        Supports filtering by:
        - user: User ID who performed the action
        - action: Action type (CREATE, UPDATE, DELETE, etc.)
        - resource: Resource type (soul, judgment, karma, etc.)
        - resource_id: Specific resource ID
        - start_date/end_date: Time range filter

        Example:
            GET /api/v1/audit-logs/?user=1&action=CREATE&resource=soul
            GET /api/v1/audit-logs/?start_date=2024-01-01&end_date=2024-12-31
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - BATCH_CREATE
          - BATCH_DELETE
          - BATCH_UPDATE
          - CREATE
          - DELETE
          - EXECUTE
          - EXPORT
          - IMPORT
          - LOGIN
          - LOGOUT
          - PERMISSION_CHANGE
          - READ
          - UPDATE
          - VIEW
        description: |-
          * `CREATE` - 创建
          * `UPDATE` - 更新
          * `DELETE` - 删除
          * `EXECUTE` - 执行
          * `READ` - 读取
          * `LOGIN` - 登录
          * `LOGOUT` - 登出
          * `VIEW` - 查看
          * `EXPORT` - 导出
          * `IMPORT` - 导入
          * `PERMISSION_CHANGE` - 权限变更
          * `BATCH_CREATE` - 批量创建
          * `BATCH_UPDATE` - 批量更新
          * `BATCH_DELETE` - 批量删除
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: resource
        schema:
          type: string
      - in: query
        name: resource_id
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit-logs/{id}/:
    get:
      operationId: v1_audit_logs_retrieve
      description: |-
        AuditLog ViewSet with filtering support.

        Supports filtering by:
        - user: User ID who performed the action
        - action: Action type (CREATE, UPDATE, DELETE, etc.)
        - resource: Resource type (soul, judgment, karma, etc.)
        - resource_id: Specific resource ID
        - start_date/end_date: Time range filter

        Example:
            GET /api/v1/audit-logs/?user=1&action=CREATE&resource=soul
            GET /api/v1/audit-logs/?start_date=2024-01-01&end_date=2024-12-31
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Audit Log.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogDetail'
          description: ''
  /api/v1/audit-logs/actions/:
    get:
      operationId: v1_audit_logs_actions_list
      description: |-
        GET /api/v1/audit-logs/actions/
        Returns all available action types.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - BATCH_CREATE
          - BATCH_DELETE
          - BATCH_UPDATE
          - CREATE
          - DELETE
          - EXECUTE
          - EXPORT
          - IMPORT
          - LOGIN
          - LOGOUT
          - PERMISSION_CHANGE
          - READ
          - UPDATE
          - VIEW
        description: |-
          * `CREATE` - 创建
          * `UPDATE` - 更新
          * `DELETE` - 删除
          * `EXECUTE` - 执行
          * `READ` - 读取
          * `LOGIN` - 登录
          * `LOGOUT` - 登出
          * `VIEW` - 查看
          * `EXPORT` - 导出
          * `IMPORT` - 导入
          * `PERMISSION_CHANGE` - 权限变更
          * `BATCH_CREATE` - 批量创建
          * `BATCH_UPDATE` - 批量更新
          * `BATCH_DELETE` - 批量删除
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: resource
        schema:
          type: string
      - in: query
        name: resource_id
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditActionOption'
          description: ''
  /api/v1/audit-logs/resources/:
    get:
      operationId: v1_audit_logs_resources_retrieve
      description: |-
        GET /api/v1/audit-logs/resources/
        Returns all resource types that have audit logs (tenant-scoped).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
          description: Distinct `resource` values present in the caller's audit log.
  /api/v1/audit-logs/stats/:
    get:
      operationId: v1_audit_logs_stats_retrieve
      description: |-
        GET /api/v1/audit-logs/stats/
        Returns statistics about audit logs.
        Requires ADMIN role.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditStats'
          description: ''
  /api/v1/audit-logs/timeline/:
    get:
      operationId: v1_audit_logs_timeline_list
      description: |-
        GET /api/v1/audit-logs/timeline/
        权限变更时间线 — 查询权限相关操作的审计日志。

        Query params:
            resource: 资源类型过滤 (Role, RolePermission, Menu, MenuButton, FieldPermission, RowLevelDataScope)
            action: 操作类型过滤 (CREATE, UPDATE, DELETE, PERMISSION_CHANGE)
            start_date: 开始日期 (YYYY-MM-DD)
            end_date: 结束日期 (YYYY-MM-DD)
            limit: 返回条数 (默认 50,上限 TIMELINE_MAX_LIMIT;非正整数 400)
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - BATCH_CREATE
          - BATCH_DELETE
          - BATCH_UPDATE
          - CREATE
          - DELETE
          - EXECUTE
          - EXPORT
          - IMPORT
          - LOGIN
          - LOGOUT
          - PERMISSION_CHANGE
          - READ
          - UPDATE
          - VIEW
        description: |-
          * `CREATE` - 创建
          * `UPDATE` - 更新
          * `DELETE` - 删除
          * `EXECUTE` - 执行
          * `READ` - 读取
          * `LOGIN` - 登录
          * `LOGOUT` - 登出
          * `VIEW` - 查看
          * `EXPORT` - 导出
          * `IMPORT` - 导入
          * `PERMISSION_CHANGE` - 权限变更
          * `BATCH_CREATE` - 批量创建
          * `BATCH_UPDATE` - 批量更新
          * `BATCH_DELETE` - 批量删除
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: resource
        schema:
          type: string
      - in: query
        name: resource_id
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/audit-logs/trace/{trace_id}/:
    get:
      operationId: v1_audit_logs_trace_list
      description: |-
        GET /api/v1/audit-logs/trace/{trace_id}/
        按 trace_id 查询关联操作 — 查看同一请求内的所有变更。
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - BATCH_CREATE
          - BATCH_DELETE
          - BATCH_UPDATE
          - CREATE
          - DELETE
          - EXECUTE
          - EXPORT
          - IMPORT
          - LOGIN
          - LOGOUT
          - PERMISSION_CHANGE
          - READ
          - UPDATE
          - VIEW
        description: |-
          * `CREATE` - 创建
          * `UPDATE` - 更新
          * `DELETE` - 删除
          * `EXECUTE` - 执行
          * `READ` - 读取
          * `LOGIN` - 登录
          * `LOGOUT` - 登出
          * `VIEW` - 查看
          * `EXPORT` - 导出
          * `IMPORT` - 导入
          * `PERMISSION_CHANGE` - 权限变更
          * `BATCH_CREATE` - 批量创建
          * `BATCH_UPDATE` - 批量更新
          * `BATCH_DELETE` - 批量删除
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: resource
        schema:
          type: string
      - in: query
        name: resource_id
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: trace_id
        schema:
          type: string
          description: 请求追踪ID，关联同一HTTP请求内的多个操作
        required: true
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: v1_auth_change_password_create
      description: |-
        POST /api/v1/auth/change-password/
        Change password — requires old password verification.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        POST /api/v1/auth/login/
        Returns access + refresh tokens with tenant info.
        Logs login success/failure to LoginLog.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/login-logs/:
    get:
      operationId: v1_auth_login_logs_list
      description: |-
        登录日志 API

        仅 ADMIN 角色可访问，只读的登录日志查询接口。

        Endpoints:
            GET /api/v1/login-logs/        - 获取登录日志列表
            GET /api/v1/login-logs/{id}/   - 获取登录日志详情
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLoginLogList'
          description: ''
  /api/v1/auth/login-logs/{id}/:
    get:
      operationId: v1_auth_login_logs_retrieve
      description: |-
        登录日志 API

        仅 ADMIN 角色可访问，只读的登录日志查询接口。

        Endpoints:
            GET /api/v1/login-logs/        - 获取登录日志列表
            GET /api/v1/login-logs/{id}/   - 获取登录日志详情
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Login Log.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLog'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: |-
        POST /api/v1/auth/logout/
        Blacklist the refresh token.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/profile/:
    get:
      operationId: v1_auth_profile_retrieve
      description: |-
        GET /api/v1/auth/profile/ — get current user
        PATCH /api/v1/auth/profile/ — update current user
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_auth_profile_partial_update
      description: |-
        GET /api/v1/auth/profile/ — get current user
        PATCH /api/v1/auth/profile/ — update current user
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        POST /api/v1/auth/refresh/
        Returns new access token from refresh token.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: |-
        POST /api/v1/auth/register/
        Create a new user account.
        Rate limited via DRF throttle (RegisterThrottle: 5/hour per IP).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/reset-password/:
    post:
      operationId: v1_auth_reset_password_create
      description: |-
        POST /api/v1/auth/reset-password/
        Forgot password — generate 6-digit code and send to email.
        Stores code in Redis cache with 5-minute TTL.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPassword'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/set-new-password/:
    post:
      operationId: v1_auth_set_new_password_create
      description: |-
        POST /api/v1/auth/set-new-password/
        Set new password via email + verification code from Redis.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNewPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetNewPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetNewPassword'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/chat/inbox/:
    get:
      operationId: v1_chat_inbox_list
      description: |-
        `/api/v1/chat/inbox/` —— 灵魂写给殿司的信。

        租户隔离走 `scope_to_tenant` 的**直接 tenant 列**:收件人就是那一列,而它在灵魂
        暂居结束回归原文明之后不会改变(见 `apps/chat/models.py` 的注释)。所以一个殿司
        永远只看得见写给自己的那些,包括当初暂居在这里的灵魂写的。
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: soul_a
        schema:
