            for ancient records. On write, `YYYY-MM-DD` and `-YYYY-MM-DD` strings
            are also accepted for backward compatibility; see `HistoricalDateField.to_internal_value`.
          properties:
            year:
              type: integer
            month:
              type: integer
              nullable: true
            day:
              type: integer
              nullable: true
