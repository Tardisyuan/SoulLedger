components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - EXECUTE
      - READ
      - LOGIN
      - LOGOUT
      - VIEW
      - EXPORT
      - IMPORT
      - PERMISSION_CHANGE
      - BATCH_CREATE
      - BATCH_UPDATE
      - BATCH_DELETE
      type: string
      description: |-
        * `CREATE` - 创建
        * `UPDATE` - 更新
        * `DELETE` - 删除
        * `EXECUTE` - 执行
        * `READ` - 读取
        * `LOGIN` - 登录
        * `LOGOUT` - 登出
        * `VIEW` - 查看
        * `EXPORT` - 导出
        * `IMPORT` - 导入
        * `PERMISSION_CHANGE` - 权限变更
        * `BATCH_CREATE` - 批量创建
        * `BATCH_UPDATE` - 批量更新
        * `BATCH_DELETE` - 批量删除
    Actor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Primary / local name
          maxLength: 255
        civilization:
          $ref: '#/components/schemas/CivilizationEnum'
        role:
          $ref: '#/components/schemas/ActorRoleEnum'
        realm:
          type: string
          format: uuid
          nullable: true
        realm_code:
          type: string
          readOnly: true
        name_zh:
          type: string
          maxLength: 255
        name_en:
          type: string
          maxLength: 255
        name_egy:
          type: string
          description: "Egyptian name — transliteration or hieroglyphs (\U00013080)"
          maxLength: 255
        title:
          type: string
          maxLength: 255
        title_zh:
          type: string
          maxLength: 255
        title_en:
          type: string
          maxLength: 255
        title_egy:
          type: string
          maxLength: 255
        description:
          type: string
        powers_json: {}
        icon_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        is_active:
          type: boolean
      required:
      - civilization
      - id
      - name
      - realm_code
      - role
    ActorList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Primary / local name
          maxLength: 255
        civilization:
          $ref: '#/components/schemas/CivilizationEnum'
        role:
          $ref: '#/components/schemas/ActorRoleEnum'
        realm_code:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        display_title:
          type: string
          readOnly: true
        is_active:
          type: boolean
        assessor_index:
          type: integer
          nullable: true
