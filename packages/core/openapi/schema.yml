    NonFungible:
      type: object
      description: |-
        `offset_within_classes` — 功過有不可折者, netted per class.

        `by_class` is keyed by fungibility class name, not a list: the classes are
        derived from record categories and the caller looks one up rather than
        scanning.

        `granularity_applied` False does not mean the rule was tested and did not
        bite — `granularity_unavailable` is the sentence saying why, and it is
        always present for exactly that reason.
      properties:
        by_class:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FungibilityClassTotal'
        unoffset_demerit:
          type: number
          format: double
        unusable_merit:
          type: number
          format: double
        rule_zh:
          type: string
        rule_source:
          type: string
        attested_classes:
          type: array
          items:
            type: string
        granularity_rule_zh:
          type: string
        granularity_applied:
          type: boolean
        granularity_unavailable:
          type: string
        granularity_missing_inputs:
          type: array
          items:
            type: string
      required:
      - attested_classes
      - by_class
      - granularity_applied
      - granularity_missing_inputs
      - granularity_rule_zh
      - granularity_unavailable
      - rule_source
      - rule_zh
      - unoffset_demerit
      - unusable_merit
