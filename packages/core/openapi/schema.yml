  /api/v1/souls/{id}/records/{record_id}/acknowledge-date-warning/:
    post:
      operationId: v1_souls_records_acknowledge_date_warning_create
      description: |-
        Acknowledge a record's `event_after_death` DateProblem WARNING.

        `self.get_object()` runs TenantPermission's object check on the
        soul, same as every other detail action here — an operator who can
        reach this soul at all can acknowledge warnings on its records; no
        separate codename, following the precedent `add_record` already
        set for soul.update covering record-level writes.

        The acting user comes from `request.user` only. Nothing in the
        request body is trusted for who — a client-supplied "acknowledged_by"
        would let one operator's action be attributed to another.

        Only `event_after_death` is acknowledgeable. The other DateProblems
        (`death_before_birth`, `implausible_lifespan`, `event_before_birth`)
        are ERRORs: the write that would have created them is refused
        before it lands, so there is never a persisted row carrying one to
        acknowledge.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Soul.
        required: true
      - in: path
        name: record_id
        schema:
          type: string
          format: uuid
        description: 'The SoulRecord''s primary key. drf-spectacular cannot infer
          this one: it looks the name up on the viewset''s model, and `Soul` has no
          `record_id` field — the id belongs to the related SoulRecord. Left un-annotated
          it defaults to `string`, which is the same silent widening an un-hinted
          SerializerMethodField suffers.'
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Soul'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Soul'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Soul'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Soul'
          description: ''
  /api/v1/souls/{id}/records/{record_id}/unacknowledge-date-warning/:
    post:
      operationId: v1_souls_records_unacknowledge_date_warning_create
      description: |-
        Undo a prior acknowledgment of a record's `event_after_death` warning.

        Clears all three ack fields regardless of whether the fingerprint
        still matches — an operator revoking a stale (already-inert) ack is
        harmless, and refusing it over a mismatch that made it inert anyway
        would just be a confusing error for no protective benefit.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Soul.
        required: true
      - in: path
        name: record_id
        schema:
          type: string
          format: uuid
        description: 'The SoulRecord''s primary key. drf-spectacular cannot infer
          this one: it looks the name up on the viewset''s model, and `Soul` has no
          `record_id` field — the id belongs to the related SoulRecord. Left un-annotated
          it defaults to `string`, which is the same silent widening an un-hinted
          SerializerMethodField suffers.'
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Soul'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Soul'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Soul'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Soul'
          description: ''
