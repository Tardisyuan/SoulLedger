components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - EXECUTE
      - READ
      - LOGIN
      - LOGOUT
      - VIEW
      - EXPORT
      - IMPORT
      - PERMISSION_CHANGE
      - BATCH_CREATE
      - BATCH_UPDATE
      - BATCH_DELETE
      type: string
      description: |-
        * `CREATE` - 创建
        * `UPDATE` - 更新
        * `DELETE` - 删除
        * `EXECUTE` - 执行
        * `READ` - 读取
        * `LOGIN` - 登录
        * `LOGOUT` - 登出
        * `VIEW` - 查看
        * `EXPORT` - 导出
        * `IMPORT` - 导入
        * `PERMISSION_CHANGE` - 权限变更
        * `BATCH_CREATE` - 批量创建
        * `BATCH_UPDATE` - 批量更新
        * `BATCH_DELETE` - 批量删除
    Actor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Primary / local name
          maxLength: 255
        civilization:
          $ref: '#/components/schemas/CivilizationEnum'
        role:
          $ref: '#/components/schemas/ActorRoleEnum'
        realm:
          type: string
          format: uuid
          nullable: true
        realm_code:
          type: string
          readOnly: true
        name_zh:
          type: string
          maxLength: 255
        name_en:
          type: string
          maxLength: 255
        name_egy:
          type: string
          description: "Egyptian name — transliteration or hieroglyphs (\U00013080)"
          maxLength: 255
        title:
          type: string
          maxLength: 255
        title_zh:
          type: string
          maxLength: 255
        title_en:
          type: string
          maxLength: 255
        title_egy:
          type: string
          maxLength: 255
        description:
          type: string
        powers_json: {}
        icon_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        is_active:
          type: boolean
      required:
      - civilization
      - id
      - name
      - realm_code
      - role
    ActorList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Primary / local name
          maxLength: 255
        civilization:
          $ref: '#/components/schemas/CivilizationEnum'
        role:
          $ref: '#/components/schemas/ActorRoleEnum'
        realm_code:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        display_title:
          type: string
          readOnly: true
        is_active:
          type: boolean
        assessor_index:
          type: integer
          nullable: true
          readOnly: true
      required:
      - assessor_index
      - civilization
      - display_name
      - display_title
      - id
      - name
      - realm_code
      - role
    ActorRoleEnum:
      enum:
      - JUDGE
      - EXECUTOR
      - GUARDIAN
      - CONDUIT
      - OVERSEER
      type: string
      description: |-
        * `JUDGE` - Judge
        * `EXECUTOR` - Executor / Punisher
        * `GUARDIAN` - Guardian
        * `CONDUIT` - Soul Conduit / Guide
        * `OVERSEER` - Overseer / Admin
    AdmittedBalance:
      type: object
      description: |-
        `LedgerService.get_admitted_balance`. `balance` and `not_admitted_net`
        are null unless `reading_kind` is BALANCE (and the judgment is from the
        current life); `reason_code` says which.
      properties:
        reading_kind:
          type: string
          nullable: true
        balance:
          type: integer
          nullable: true
        not_admitted_count:
          type: integer
        not_admitted_net:
          type: number
          format: double
          nullable: true
        reason_code:
          type: string
          nullable: true
      required:
      - balance
      - not_admitted_count
      - not_admitted_net
      - reading_kind
      - reason_code
    ApiKeyRateLimit:
      type: object
      description: |-
        The two configured ceilings on the key. Zero when there is no key on
        the request, which is what the health view substitutes rather than
        omitting the block.
      properties:
        per_minute:
          type: integer
        per_hour:
          type: integer
      required:
      - per_hour
      - per_minute
    ApiKeyRateLimitRemaining:
      type: object
      description: |-
        Requests actually left in each window.

        Nullable, and that is the point of the field existing: `remaining_for`
        returns None when the counter cannot be read, and the view reports that
        as null rather than inventing a number. A null here is "unknown", never
        "zero" — these two were once reported under this name while carrying the
        configured ceiling, which is never the remaining count.
      properties:
        per_minute:
          type: integer
          nullable: true
        per_hour:
          type: integer
          nullable: true
      required:
      - per_hour
      - per_minute
    ApprovalNode:
      type: object
      description: |-
        Serializer for ApprovalNode.

        `status`, `verdict`, `approver` and `decided_at` are the fields
        ApprovalWorkflow.complete_node() (called from
        ApprovalWorkflowViewSet.approve_node, gated by `workflow.approve`) writes
        to record a decision — and, in the same call, also advances the parent
        workflow's `current_node`/`status`, and sets `completed_at` when that was
        the last node. ApprovalNodeViewSet.partial_update maps to `workflow.update`,
        which MODERATOR holds despite being deliberately denied `workflow.approve`
        (see ApprovalWorkflowViewSet's extra_permissions and the ROLE_PERMISSIONS
        entry for MODERATOR) — so a plain PATCH here used to let MODERATOR forge a
        verdict on a real pending node while skipping every one of complete_node's
        side effects: the workflow never advanced, `completed_at` never got set,
        and nothing recorded that the "approval" never happened. validate() below
        closes that with an explicit 400, the same shape as
        DispatchRecordSerializer.validate() in apps/dispatch/serializers.py.

        The paragraph above used to end by saying these four were guarded on the
        update path only, because "node fixtures across apps/workflow/tests.py
        rely on POSTing a node with status='APPROVED' already set". That was true
        and it was not a reason. Closing PATCH while leaving POST open left the
        same forgery one request away by another door: measured 2026-08-29, a
        MODERATOR who gets 403 from approve_node can POST to /api/v1/nodes/ with
        status=APPROVED, verdict=PASSED, approver=<any user id> and
        decided_at=<any timestamp> and receive a 201. Nothing downstream
        distinguishes the resulting row from one complete_node() wrote. A test
        fixture's convenience is not a reason to leave a decision field writable —
        the fixtures now seed decided nodes through the ORM, which is where
        fixtures should be setting them anyway.

        So all four are read-only now, and validate() raises on create as well as
        update. Raising rather than silently stripping matters here for the same
        reason it does everywhere else in this file: a client that sends
        {"status": "APPROVED"} has to learn nothing was approved.

        `workflow` is validated against the requester's tenant rather than being
        left to the field's default queryset. That default is
        `ApprovalWorkflow.objects` — a TenantManager — but at serializer-validation
        time the tenant contextvar is not set, so it returned rows from every
        tenant: measured, `ApprovalNodeSerializer().fields["workflow"].queryset`
        handed back 2 rows across 2 tenants. `scope_to_tenant` is applied in
        `get_queryset()`, which covers PATCH and GET (a cross-tenant PATCH
        correctly 404s) and does not cover POST — so a MODERATOR in tenant A could
        POST a node into tenant B's live approval chain and get a 201.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workflow:
          type: string
          format: uuid
        node_name:
          type: string
          maxLength: 255
        node_order:
          type: integer
        node_type:
          $ref: '#/components/schemas/ApprovalNodeNodeTypeEnum'
        approver_type:
          $ref: '#/components/schemas/ApprovalNodeApproverTypeEnum'
        approver_actor:
          type: string
          format: uuid
          nullable: true
        approver_role:
          type: string
          description: JUDGE, OVERSEER, etc.
          maxLength: 20
        court_code:
          type: string
          description: 第一殿, Hall of Two Truths, etc.
          maxLength: 50
        realm:
          type: string
          format: uuid
          nullable: true
        required_verdicts:
          description: 可接受的裁决列表，如 ['PASSED', 'FAILED', 'RETRY']
        status:
          allOf:
          - $ref: '#/components/schemas/ApprovalNodeStatusEnum'
          readOnly: true
        verdict:
          type: string
          readOnly: true
        evidence_json: {}
        notes:
          type: string
        approver:
          type: integer
          readOnly: true
          nullable: true
        approver_username:
          type: string
          readOnly: true
          nullable: true
        approver_display_name:
          type: string
          readOnly: true
          nullable: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
