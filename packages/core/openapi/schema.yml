          - SENTENCE_PLAN_CANCELLED
          - SENTENCE_PLAN_COMPLETED
          - SENTENCE_PLAN_CREATED
          - SENTENCE_REQUEST_CREATED
          - SENTENCE_REQUEST_DECIDED
          - SETTLEMENT_CORRECTED
          - SOUL_ACCOUNT_CREATED
          - SOUL_ACCOUNT_RETIRED
          - SOUL_CREATED
          - STATE_CHANGED
          - USER_FOLLOWED
          - USER_UNFOLLOWED
          - WORKFLOW_APPROVED
          - WORKFLOW_ASSIGNED
          - WORKFLOW_CREATED
          - WORKFLOW_REJECTED
        description: |-
          * `SOUL_CREATED` - Soul Created
          * `STATE_CHANGED` - State Changed
          * `SETTLEMENT_CORRECTED` - Settlement Corrected
          * `RECORD_ADDED` - Record Added
          * `JUDGMENT_INITIATED` - Judgment Initiated
          * `JUDGMENT_CONCLUDED` - Judgment Concluded
          * `DISPOSITION_CREATED` - Disposition Created
          * `DISPOSITION_EXPIRED` - Disposition Expired
          * `REINCARNATION_TRIGGERED` - Reincarnation Triggered
          * `KARMA_RECALCULATED` - Karma Recalculated
          * `WORKFLOW_CREATED` - Workflow Created
          * `WORKFLOW_ASSIGNED` - Workflow Assigned
          * `WORKFLOW_APPROVED` - Workflow Approved
          * `WORKFLOW_REJECTED` - Workflow Rejected
          * `DISPATCH_CREATED` - Dispatch Created
