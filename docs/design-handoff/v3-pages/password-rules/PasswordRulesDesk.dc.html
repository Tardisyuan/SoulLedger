<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:880px;background:oklch(var(--color-canvas));color:oklch(var(--color-ink));font-family:var(--font-sans);font-size:14px;line-height:20px;padding:32px;box-sizing:border-box">
<x-import component-from-global-scope="SoulLedger.SoulLedgerProvider" civ="eg" pathname="/profile" hint-size="816px,520px">
<section style="border:1px solid oklch(var(--color-line));background:oklch(var(--color-surface-1));display:flex;flex-direction:column">
<header style="padding:16px 24px;border-bottom:1px solid oklch(var(--color-line));display:flex;flex-direction:column;gap:4px"><h2 style="margin:0;font-size:16px;line-height:24px;font-weight:600">修改密码</h2><span style="color:oklch(var(--color-ink-muted))">改完后，其他设备上的登录会退出。</span></header>
<div style="padding:24px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px 32px;align-items:start">
<label style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:500">当前密码</span><span style="height:40px;box-sizing:border-box;padding:0 12px;display:flex;align-items:center;border:1px solid oklch(var(--color-line-strong));background:oklch(var(--color-canvas));letter-spacing:.15em">•••••••••</span></label><span></span>
<label style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:500">新密码</span><span style="position:relative;height:40px;box-sizing:border-box;padding:0 4px 0 12px;display:flex;align-items:center;border:1px solid oklch(var(--color-line-strong));background:oklch(var(--color-canvas))"><span aria-hidden="true" style="position:absolute;inset:-1px;border:1px solid oklch(var(--color-ink));box-shadow:0 0 0 2px oklch(var(--color-focus) / .35);pointer-events:none"></span><span style="flex:1;display:flex;align-items:center;gap:2px;letter-spacing:.15em">•••••••<span aria-hidden="true" style="width:2px;height:18px;background:oklch(var(--color-ink))"></span></span><span role="button" style="height:32px;padding:0 8px;display:flex;align-items:center;color:oklch(var(--color-ink-muted))">显示</span></span></label>
<ul style="margin:0;padding:28px 0 0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:20px">
<li style="display:flex;gap:8px;align-items:baseline"><span aria-hidden="true" style="width:16px;text-align:center;color:oklch(var(--color-ink-muted))">○</span><span style="color:oklch(var(--color-ink-muted))">至少 8 位</span></li>
<li style="display:flex;gap:8px;align-items:baseline"><span aria-hidden="true" style="width:16px;text-align:center;font-weight:600">✓</span><span style="font-weight:500">不只是数字</span></li>
<li style="display:flex;gap:8px;align-items:baseline"><span aria-hidden="true" style="width:16px;text-align:center;font-weight:600">✓</span><span style="font-weight:500">和当前密码不同</span></li>
<li style="display:flex;gap:8px;align-items:baseline;padding-top:4px"><span aria-hidden="true" style="width:16px;text-align:center;color:oklch(var(--color-ink-muted))">◇</span><span style="color:oklch(var(--color-ink-muted))">别用常见密码，也别用自己的名字或编号</span></li>
</ul>
<label style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:500">再输一次新密码</span><span style="height:40px;box-sizing:border-box;padding:0 12px;display:flex;align-items:center;border:1px solid oklch(var(--color-line-strong));background:oklch(var(--color-canvas))"></span></label>
<div style="padding-top:38px;display:flex;gap:8px;align-items:baseline;font-size:13px;line-height:20px"><span aria-hidden="true" style="width:16px;text-align:center;color:oklch(var(--color-ink-muted))">○</span><span style="color:oklch(var(--color-ink-muted))">两次输入一致</span></div>
</div>
<footer style="padding:16px 24px;border-top:1px solid oklch(var(--color-line));display:flex;gap:8px"><span role="button" style="height:40px;padding:0 20px;display:flex;align-items:center;background:oklch(var(--color-main));color:oklch(var(--color-on-main));font-weight:500">保存新密码</span><span role="button" style="height:40px;padding:0 20px;display:flex;align-items:center;border:1px solid oklch(var(--color-line-strong))">取消</span></footer>
</section>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:560}}"></script>
</body>
</html>
