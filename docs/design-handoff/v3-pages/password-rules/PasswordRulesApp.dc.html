<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div class="{{ theme }}" data-civ="{{ civ }}" style="width:393px;height:852px;overflow:hidden;position:relative;background:oklch(var(--color-canvas));color:oklch(var(--color-ink));font-family:var(--font-sans);font-size:15px;line-height:24px">
<x-import component-from-global-scope="SoulLedger.SoulLedgerProvider" civ="{{ civ }}" pathname="/settings/password" hint-size="393px,852px">
<div style="height:852px;display:flex;flex-direction:column;border-top:3px solid oklch(var(--color-main));box-sizing:border-box;position:relative">
<header style="height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 16px 0 4px;border-bottom:1px solid oklch(var(--color-line));background:oklch(var(--color-surface-1));position:relative;z-index:2"><span role="button" aria-label="返回" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px">‹</span><h1 style="margin:0;font-weight:600;font-size:17px;line-height:24px">修改密码</h1></header>
<div style="flex:1;min-height:0;overflow:hidden;background:oklch(var(--color-surface-1))">
<sc-if value="{{ scrolled }}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="height:0;margin-top:-112px"></div></sc-if>
<div style="padding:24px 16px;display:flex;flex-direction:column;gap:24px">

<label style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:500">当前密码</span><span style="height:56px;box-sizing:border-box;padding:0 4px 0 16px;display:flex;align-items:center;border:1px solid oklch(var(--color-line-strong));background:oklch(var(--color-canvas))"><span style="flex:1;font-size:20px;letter-spacing:.15em">{{ curDots }}</span><span role="button" style="height:44px;padding:0 12px;display:flex;align-items:center;color:oklch(var(--color-ink-muted))">显示</span></span></label>

<div style="display:flex;flex-direction:column;gap:8px">
<label style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:500">新密码</span><span aria-describedby="pw-rules" style="position:relative;height:56px;box-sizing:border-box;padding:0 4px 0 16px;display:flex;align-items:center;border:1px solid oklch(var(--color-line-strong));background:oklch(var(--color-canvas))"><sc-if value="{{ newFocus }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;inset:-1px;border:1px solid oklch(var(--color-ink));box-shadow:0 0 0 2px oklch(var(--color-focus) / .35);pointer-events:none"></span></sc-if><sc-if value="{{ newErr }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;inset:-1px;border:1px solid oklch(var(--color-danger));pointer-events:none"></span></sc-if><span style="flex:1;display:flex;align-items:center;gap:2px;font-size:20px;letter-spacing:.15em">{{ newDots }}<sc-if value="{{ newFocus }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width:2px;height:24px;background:oklch(var(--color-ink))"></span></sc-if></span><span role="button" style="height:44px;padding:0 12px;display:flex;align-items:center;color:oklch(var(--color-ink-muted))">显示</span></span></label>
<sc-if value="{{ rejected }}" hint-placeholder-val="{{ false }}"><span role="alert" style="display:flex;flex-direction:column;font-size:13px;line-height:20px;color:oklch(var(--color-danger))"><span style="font-weight:600">! 这个密码太容易被猜到</span><span style="color:oklch(var(--color-ink-muted));text-wrap:pretty">它在常见密码名单里，或和你的名字、编号太像。换一个再保存。</span></span></sc-if>
<ul id="pw-rules" style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:20px">
<sc-for list="{{ rules }}" as="r" hint-placeholder-count="3"><li style="display:flex;gap:8px;align-items:baseline">
<sc-if value="{{ r.idle }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width:16px;flex:none;text-align:center;color:oklch(var(--color-ink-muted))">○</span><span style="color:oklch(var(--color-ink-muted))">{{ r.text }}</span></sc-if>
<sc-if value="{{ r.ok }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width:16px;flex:none;text-align:center;font-weight:600">✓</span><span style="font-weight:500">{{ r.text }}</span></sc-if>
<sc-if value="{{ r.bad }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width:16px;flex:none;text-align:center;font-weight:600;color:oklch(var(--color-danger))">!</span><span style="font-weight:600;color:oklch(var(--color-danger))">{{ r.text }}</span></sc-if>
</li></sc-for>
<sc-if value="{{ noteOn }}" hint-placeholder-val="{{ true }}"><li style="display:flex;gap:8px;align-items:baseline;padding-top:4px"><span aria-hidden="true" style="width:16px;flex:none;text-align:center;color:oklch(var(--color-ink-muted))">◇</span><span style="color:oklch(var(--color-ink-muted));text-wrap:pretty">别用常见密码，也别用自己的名字或编号</span></li></sc-if>
</ul>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:500">再输一次新密码</span><span style="position:relative;height:56px;box-sizing:border-box;padding:0 4px 0 16px;display:flex;align-items:center;border:1px solid oklch(var(--color-line-strong));background:oklch(var(--color-canvas))"><sc-if value="{{ cfFocus }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;inset:-1px;border:1px solid oklch(var(--color-ink));box-shadow:0 0 0 2px oklch(var(--color-focus) / .35);pointer-events:none"></span></sc-if><sc-if value="{{ cfErr }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;inset:-1px;border:1px solid oklch(var(--color-danger));pointer-events:none"></span></sc-if><span style="flex:1;font-size:20px;letter-spacing:.15em">{{ cfDots }}</span><span role="button" style="height:44px;padding:0 12px;display:flex;align-items:center;color:oklch(var(--color-ink-muted))">显示</span></span></label>
<div style="display:flex;gap:8px;align-items:baseline;font-size:13px;line-height:20px">
<sc-if value="{{ match.idle }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width:16px;flex:none;text-align:center;color:oklch(var(--color-ink-muted))">○</span><span style="color:oklch(var(--color-ink-muted))">两次输入一致</span></sc-if>
<sc-if value="{{ match.ok }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width:16px;flex:none;text-align:center;font-weight:600">✓</span><span style="font-weight:500">两次输入一致</span></sc-if>
<sc-if value="{{ match.bad }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width:16px;flex:none;text-align:center;font-weight:600;color:oklch(var(--color-danger))">!</span><span style="font-weight:600;color:oklch(var(--color-danger))">两次输入不一致</span></sc-if>
</div>
</div>

<span role="button" style="height:56px;display:flex;align-items:center;justify-content:center;background:oklch(var(--color-main));color:oklch(var(--color-on-main));font-weight:500">保存新密码</span>
</div>
</div>
<sc-if value="{{ kb }}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:336px;background:oklch(0.86 0.004 135);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;z-index:3;font-family:var(--font-mono);font-size:13px;color:oklch(0.4 0 0)"><span>系统键盘 · 336</span><span style="font-size:12px">(含联想 / 密码建议栏)</span></div></sc-if>
</div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;entry&quot;,&quot;typing&quot;,&quot;done&quot;,&quot;savefail&quot;,&quot;rejected&quot;],&quot;default&quot;:&quot;entry&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;civ&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;eg&quot;,&quot;cn&quot;],&quot;default&quot;:&quot;eg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'entry';
    const dots = n => '•'.repeat(n);
    const S = {
      entry:    { cur: 0,  nw: 0,  cf: 0,  focus: null, kb: false, rules: ['idle','idle','idle'], match: 'idle', y: 0 },
      typing:   { cur: 9,  nw: 7,  cf: 0,  focus: 'new', kb: true, rules: ['idle','ok','ok'],    match: 'idle', y: -112 },
      done:     { cur: 9,  nw: 11, cf: 11, focus: 'cf',  kb: true, rules: ['ok','ok','ok'],      match: 'ok',   y: -112 },
      savefail: { cur: 9,  nw: 8,  cf: 7,  focus: null,  kb: false, rules: ['ok','bad','ok'],    match: 'bad',  y: 0 },
      rejected: { cur: 9,  nw: 11, cf: 11, focus: null,  kb: false, rules: ['ok','ok','ok'],     match: 'ok',   y: 0, rej: true }
    }[st] || {};
    const texts = ['至少 8 位', '不只是数字', '和当前密码不同'];
    const m = s => ({ idle: s === 'idle', ok: s === 'ok', bad: s === 'bad' });
    const rules = texts.map((t, i) => ({ text: t, ...m(S.rules[i]) }));
    return {
      theme: this.props.theme ?? 'light', civ: this.props.civ ?? 'eg',
      scrolled: S.y !== 0, kb: S.kb,
      curDots: dots(S.cur), newDots: dots(S.nw), cfDots: dots(S.cf),
      newFocus: S.focus === 'new', cfFocus: S.focus === 'cf',
      newErr: !!S.rej || S.rules.includes('bad'), cfErr: S.match === 'bad',
      rejected: !!S.rej, noteOn: !S.rej,
      rules, match: m(S.match)
    };
  }
}
</script>
</body>
</html>
