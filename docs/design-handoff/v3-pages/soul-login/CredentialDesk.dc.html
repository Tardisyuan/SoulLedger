<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><script src="./sl-data.js"></script></helmet>
<div class="{{ theme }}" data-civ="eg" style="width:1440px;height:900px;overflow:hidden;position:relative;display:flex;background:oklch(var(--color-canvas));color:oklch(var(--color-ink));font-family:var(--font-sans);font-size:13px;line-height:20px">
<x-import component-from-global-scope="SoulLedger.SoulLedgerProvider" civ="eg" pathname="/souls/credentials" hint-size="1440px,900px">
<div style="display:flex;width:1440px;height:900px">
<x-import component-from-global-scope="SoulLedger.GlobalNav" menus="{{ menus }}" all-menu-paths="{{ paths }}" current-id="{{ navId }}" open-id="{{ navId }}" on-toggle="{{ noop }}" collapsed="{{ false }}" user="{{ user }}" hint-size="240px,900px"></x-import>
<main style="flex:1;min-width:0;display:flex;flex-direction:column">
<div style="height:52px;flex:none;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid oklch(var(--color-line))"><x-import component-from-global-scope="SoulLedger.Breadcrumb" menus="{{ menus }}" hint-size="300px,20px"></x-import></div>
<dc-import name="Plaque3" title="初始密码交付" hall="杜阿特 · 第二殿" meta="待交付 3 · 初始密码 72 小时内有效" civ="eg" compact="{{ true }}" hint-size="100%,48px"></dc-import>
<div style="padding:16px 24px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:oklch(var(--color-ink-muted))">未能自动发送的灵魂初始密码：查看一次、线下交付，或重试发送</span><span style="margin-left:auto;font-size:12px;color:oklch(var(--color-ink-muted))">交付单只印编号和二维码，不印密码</span></div>
<div style="background:oklch(var(--color-surface-1));border:1px solid oklch(var(--color-line));border-radius:8px;overflow:hidden">
<div style="display:grid;grid-template-columns:minmax(0,1.2fr) 160px 200px 180px 340px;height:40px;align-items:center;padding:0 16px;gap:16px;border-bottom:1px solid oklch(var(--color-line-strong));font-size:12px;color:oklch(var(--color-ink-muted))"><span>灵魂 · 编号</span><span>开通于</span><span>状态</span><span>有效至</span><span style="text-align:right">动作</span></div>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
<div style="display:grid;grid-template-columns:minmax(0,1.2fr) 160px 200px 180px 340px;min-height:56px;align-items:center;padding:0 16px;gap:16px;border-top:1px solid oklch(var(--color-line))">
<span style="display:flex;flex-direction:column"><span style="font-weight:500">{{ r.name }}</span><span style="font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:oklch(var(--color-ink-muted))">{{ r.id }}</span></span>
<span style="font-family:var(--font-mono);color:oklch(var(--color-ink-muted))">{{ r.made }}</span>
<span style="display:flex;flex-direction:column"><span style="font-weight:500">{{ r.st }}</span><span style="font-size:12px;color:oklch(var(--color-ink-muted))">{{ r.sub }}</span></span>
<span style="font-family:var(--font-mono)">{{ r.until }}</span>
<span style="display:flex;justify-content:flex-end;gap:16px">
<sc-if value="{{ r.live }}" hint-placeholder-val="{{ true }}"><span style="height:44px;display:inline-flex;align-items:center;text-decoration:underline">{{ r.first }}</span><span style="height:44px;display:inline-flex;align-items:center;gap:6px;text-decoration:underline"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5.75 7.25v-4.5h8.5v4.5M5.75 13.75h-3v-6.5h14.5v6.5h-3M5.75 11.25h8.5v6h-8.5z"></path></svg>打印交付单</span><span style="height:44px;display:inline-flex;align-items:center;text-decoration:underline">标记已交付</span></sc-if>
<sc-if value="{{ r.done }}" hint-placeholder-val="{{ false }}"><span style="height:44px;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;color:oklch(var(--color-ink-muted))"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5.75 7.25v-4.5h8.5v4.5M5.75 13.75h-3v-6.5h14.5v6.5h-3M5.75 11.25h8.5v6h-8.5z"></path></svg>补打交付单</span></sc-if>
<sc-if value="{{ r.dead }}" hint-placeholder-val="{{ false }}"><span style="height:44px;display:inline-flex;align-items:center;text-decoration:underline">去重置</span></sc-if>
</span>
</div>
</sc-for>
</div>
<span style="font-size:12px;color:oklch(var(--color-ink-muted))">「打印交付单」直接打开浏览器打印，不另做预览页。每次打印写入审计日志(动作 credentials.print_slip),不要求填理由。</span>
</div>
</main>
</div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const D = window.SLData || { menus: [], paths: [], user: null, noop: () => {} };
    const R = (name, id, made, st, sub, until, k, first) => ({ name, id, made, st, sub, until, first: first || '查看密码', live: k === 'live', done: k === 'done', dead: k === 'dead' });
    return {
      menus: D.menus, paths: D.paths, user: D.user, noop: D.noop, navId: null, theme: this.props.theme ?? 'light',
      rows: [R('塞内布', 'QU3 3Q9F W5F', '10-11 21:40', '◐ 待交付', '无可用联系方式', '10-14 21:40', 'live'), R('梅丽特', '7HK 2MVP 9RX', '10-11 18:05', '◐ 已查看，待交付', '书吏阿尼 于 20:12 查看', '10-14 18:05', 'live'), R('哈普', 'D8M 4KWT 7QA', '10-11 16:20', '◐ 待交付', '发送失败(超时),已尝试 3 次', '10-14 16:20', 'live', '重试发送'), R('卡埃姆', 'NB4 8TQZ 3CW', '10-10 09:30', '✓ 已线下交付', '书吏阿尼 于 10-10 10:02 交付', '—', 'done'), R('伊奈尼', 'X9R F2KD 6MP', '10-07 15:12', '✕ 已过期', '初始密码已过期', '10-10 15:12', 'dead')]
    };
  }
}
</script>
</body>
</html>
