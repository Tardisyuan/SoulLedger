<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第六十三批 · 已终止换字形</title><style>
:root{--canvas:#F8F8F6;--card:#FFFFFF;--card2:#F1F1EE;--ink:#16171A;--sub:#54575C;--faint:#686B70;--line:rgb(0 0 0/.12);--field:#8A8D92;--warn:#9F4A00;--neg:#A81E3C;--focus:#883F2C}
.dark{--canvas:#111113;--card:#1A1B1E;--card2:#222327;--ink:#F3F3F1;--sub:#B4B6BA;--faint:#8E9197;--line:rgb(255 255 255/.12);--field:#7C7F85;--warn:#FF9A3C;--neg:#F2849B;--focus:#EBA38F}
*{box-sizing:border-box}body{margin:0;background:#F8F8F6;color:#16171A;font:14px/1.6 Geist,"Noto Sans SC",system-ui,sans-serif}
h1{font:600 20px/28px "Noto Serif SC",serif;margin:0 0 4px}h2{font:600 16px/24px "Noto Serif SC",serif;margin:28px 0 8px}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 48px}.note{color:#54575C;margin:0 0 12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.pair{grid-template-columns:1fr}}
.pane{background:var(--canvas);color:var(--ink);border:1px solid rgb(0 0 0/.14);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lab{font-size:11px;letter-spacing:.08em;color:var(--faint)}
.modal{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px -4px rgb(0 0 0/.12)}
.modal h3{margin:0;font:600 16px/24px "Noto Serif SC",serif}.small{font-size:12px}.sub{color:var(--sub)}
.f{display:flex;flex-direction:column;gap:4px}.f label{font-size:12px;color:var(--sub)}.f label b{font-weight:500;color:var(--ink)}
.sel,.ta{border:1px solid var(--field);border-radius:4px;padding:8px 10px;background:var(--card);color:var(--ink);font-size:14px}
.ta{min-height:72px;color:var(--faint)}.ta.filled{color:var(--ink)}.ta.err{border-color:var(--neg)}
.err-t{font-size:12px;color:var(--neg)}.formerr{font-size:13px;color:var(--neg)}
.acts{display:flex;justify-content:flex-end;gap:8px}.b{height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit}.b.p{background:var(--ink);color:var(--canvas)}.b[disabled]{opacity:.4}
.tl{display:flex;flex-direction:column}.tr{display:grid;grid-template-columns:88px 18px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.tr .t{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}.tr .g{color:var(--sub)}.why{font-size:12px;color:var(--sub);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:4px;font-size:12px;border:1px solid currentColor;color:var(--sub)}.dash{border-style:dashed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{background:var(--canvas);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.mini svg{fill:none;stroke:currentColor;stroke-width:3}
</style></head><body><div class="wrap"><h1>第六十三批 · 已终止换字形</h1><p class="note">已终止从 ⊘ 换成 □（空框：这份申请到此结束，没有结论）。⊘ 只留给申诉被驳回。两者都是中性色调。</p><h2>灵魂端申请卡徽章</h2><p class="note"></p><div class="pair"><div class="pane "><div class="lab">浅色</div><div class="row"><span class="badge dash">⊘ 申诉被驳回</span><span class="badge">□ 已终止</span></div><div class="row"><span class="badge dash">⊘ Appeal rejected</span><span class="badge">□ Ended by the hall</span></div></div><div class="pane dark"><div class="lab">深色</div><div class="row"><span class="badge dash">⊘ 申诉被驳回</span><span class="badge">□ 已终止</span></div><div class="row"><span class="badge dash">⊘ Appeal rejected</span><span class="badge">□ Ended by the hall</span></div></div></div></div></body></html>
