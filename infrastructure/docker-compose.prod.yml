# Self-contained production stack (postgres, redis, backend, celery, frontend,
# nginx) — the root docker-compose.yml + docker-compose.production.yml pair is
# the other one. Variable names are the ones config/settings.py reads:
# `SECRET_KEY` and `ALLOWED_HOSTS`. The `DJANGO_`-prefixed names this file
# used to pass were read by nothing, so settings refused to start (IS-05).
x-django-env: &django-env
  DATABASE_URL: postgres://soulledger:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/soulledger
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  TRUSTED_PROXY_COUNT: "1"

services:
  postgres:
    image: postgres:16-alpine
    container_name: soulledger_postgres
    environment:
      POSTGRES_DB: soulledger
      POSTGRES_USER: soulledger
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulledger"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: soulledger_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: soulledger-backend
    container_name: soulledger_backend
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - static_files:/app/staticfiles
    environment: *django-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  celery:
    image: soulledger-backend
    container_name: soulledger_celery
    command: celery -A config.celery worker --loglevel=info
    environment: *django-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
    container_name: soulledger_frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: soulledger_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_files:
