<svg xmlns="http://www.w3.org/2000/svg" class="hero" data-node="EG_HALL_TWO_TRUTHS"  width="64" height="64" viewBox="0 0 64 64" overflow="visible" aria-hidden="true"><style>.hero{--hero-line:var(--civT, #89BCF1);--hero-fill:color-mix(in srgb,var(--civT, #89BCF1) 9%,var(--card, #1A1B1E));--hero-accent:var(--metal, #D6B25E);--hero-portal:color-mix(in srgb,var(--glow, #5F93C8) 35%,transparent);--hero-glow:var(--glow, #5F93C8);--hero-glow-op:.0;--hero-op:1}
.hero[data-state="ahead"]{--hero-line:var(--sub, #B4B6BA);--hero-fill:var(--main, #111113);--hero-accent:var(--sub, #B4B6BA);--hero-portal:transparent;--hero-glow-op:0;--hero-op:.72}
