.hero[data-state="current"]{--hero-line:var(--metal, #D6B25E);--hero-fill:color-mix(in srgb,var(--metal, #D6B25E) 12%,var(--card, #1A1B1E));--hero-accent:var(--metal, #D6B25E);--hero-portal:color-mix(in srgb,var(--metal, #D6B25E) 45%,transparent);--hero-glow:var(--metal, #D6B25E);--hero-glow-op:.55}
.hero .h-l,.hero .h-f,.hero .h-a,.hero .h-cren,.hero .h-g2{fill:none;stroke:var(--hero-line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
