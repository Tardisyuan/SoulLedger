.hero .h-p{fill:var(--hero-portal);stroke:none}
.hero .h-cren{stroke-width:3;stroke-dasharray:2.4 2.4}
.hero .h-g2{stroke-width:1.2;opacity:.45}
.hero .h-glow{fill:var(--hero-glow);opacity:var(--hero-glow-op)}
