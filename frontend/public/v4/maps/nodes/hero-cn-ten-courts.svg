<svg xmlns="http://www.w3.org/2000/svg" class="hero" data-node="dy-ten-courts"  width="64" height="64" viewBox="0 0 64 64" overflow="visible" aria-hidden="true"><style>.hero{--hero-line:var(--civT, #D98A7A);--hero-fill:color-mix(in srgb,var(--civT, #D98A7A) 9%,var(--card, #1A1B1E));--hero-accent:var(--metal, #C9A35E);--hero-portal:color-mix(in srgb,var(--glow, #C8604F) 35%,transparent);--hero-glow:var(--glow, #C8604F);--hero-glow-op:.0;--hero-op:1}
.hero[data-state="ahead"]{--hero-line:var(--sub, #B4B6BA);--hero-fill:var(--main, #111113);--hero-accent:var(--sub, #B4B6BA);--hero-portal:transparent;--hero-glow-op:0;--hero-op:.72}
.hero[data-state="walked"]{--hero-glow-op:.28}
.hero[data-state="current"]{--hero-line:var(--metal, #C9A35E);--hero-fill:color-mix(in srgb,var(--metal, #C9A35E) 12%,var(--card, #1A1B1E));--hero-accent:var(--metal, #C9A35E);--hero-portal:color-mix(in srgb,var(--metal, #C9A35E) 45%,transparent);--hero-glow:var(--metal, #C9A35E);--hero-glow-op:.55}
.hero .h-l,.hero .h-f,.hero .h-a,.hero .h-cren,.hero .h-g2{fill:none;stroke:var(--hero-line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hero .h-f{fill:var(--hero-fill)}
.hero .h-a{stroke:var(--hero-accent);stroke-width:1.4}
.hero .h-af{fill:var(--hero-accent);stroke:none}
